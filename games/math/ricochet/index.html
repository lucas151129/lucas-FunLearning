<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162b">
<title>稜鏡迴廊</title>
<style>
  :root {
    --bg: #10162b;
    --bg0: #080d1a;
    --gold: #ffd257;
    --cyan: #5ee0ff;
    --ink: #e8f0ff;
    --dim: #93a8cc;
    --wall: #1f2f55;
    --line: rgba(94, 224, 255, .3);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #070b16;
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; touch-action: manipulation; }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg0);
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; flex-direction: column; min-height: 0; }

  /* ---------------- 開始畫面 ---------------- */
  #scr-start {
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    text-align: center;
    background:
      radial-gradient(120% 90% at 14% -12%, rgba(94, 224, 255, .18), transparent 60%),
      radial-gradient(90% 90% at 102% 118%, rgba(255, 210, 87, .14), transparent 62%),
      linear-gradient(180deg, rgba(17, 28, 56, .93) 0%, rgba(11, 18, 36, .95) 58%, rgba(8, 13, 26, .97) 100%),
      url("art/floor.png");
    background-size: auto, auto, auto, 128px 128px;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat;
  }
  /* 嚮導角色：素材沒載到就整張隱藏，不會出現破圖 */
  .hero {
    display: none;
    position: absolute;
    right: max(8px, 1.2vmin);
    bottom: max(2px, .6vmin);
    z-index: 2;
    width: auto;
    height: clamp(96px, 32vh, 260px);
    pointer-events: none;
    image-rendering: pixelated;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .55)) drop-shadow(0 0 20px rgba(94, 224, 255, .16));
    opacity: .97;
  }
  .hero.ready { display: block; }
  .hero::after { content: none; }
  .ov-hero {
    position: absolute;
    left: max(8px, 1.6vmin);
    bottom: max(2px, .8vmin);
    height: clamp(90px, 30vh, 220px);
    opacity: .94;
    z-index: 1;
  }
  #scr-start::before,
  #scr-start::after {
    content: "";
    position: absolute;
    pointer-events: none;
    opacity: .5;
  }
  #scr-start::before {
    inset: 0;
    background:
      linear-gradient(90deg, transparent 49.6%, rgba(94, 224, 255, .10) 49.6% 50.4%, transparent 50.4%),
      linear-gradient(0deg, transparent 49.6%, rgba(94, 224, 255, .07) 49.6% 50.4%, transparent 50.4%);
    background-size: 180px 180px;
    -webkit-mask-image: radial-gradient(60% 60% at 50% 45%, #000 10%, transparent 80%);
    mask-image: radial-gradient(60% 60% at 50% 45%, #000 10%, transparent 80%);
  }
  #scr-start::after {
    left: 50%;
    top: 50%;
    width: 62vmin;
    height: 62vmin;
    max-width: 520px;
    max-height: 520px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(94, 224, 255, .12);
    border-radius: 50%;
    box-shadow: 0 0 90px rgba(94, 224, 255, .08) inset;
  }
  .start-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 680px;
  }
  .mark { width: 58px; height: 44px; filter: drop-shadow(0 0 12px rgba(94, 224, 255, .45)); }
  .eyebrow {
    margin: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .42em;
    color: var(--cyan);
    opacity: .9;
  }
  .title {
    margin: 0;
    font-size: clamp(25px, 8.2vh, 48px);
    line-height: 1.12;
    letter-spacing: .14em;
    color: #ffe9a8;
    text-shadow: 0 0 30px rgba(255, 210, 87, .38), 0 2px 0 #6b4b00;
  }
  .sub { margin: 0; font-size: 12px; color: #b9cbe8; line-height: 1.4; }
  .hints { display: flex; flex-direction: column; gap: 3px; margin-top: 1px; }
  .hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin: 0;
    font-size: 11.5px;
    line-height: 1.35;
    color: #c6d8f2;
  }
  .hint i {
    flex: none;
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255, 210, 87, .14);
    border: 1px solid rgba(255, 210, 87, .5);
    color: var(--gold);
    font-style: normal;
    font-size: 10px;
    font-weight: 900;
  }
  .hint b { color: #ffe9a8; }
  .hint em { font-style: normal; color: var(--cyan); letter-spacing: .08em; }
  .meta { margin: 1px 0 0; font-size: 10.5px; color: #7f93b8; line-height: 1.4; }
  .btn {
    min-height: 44px;
    min-width: 172px;
    padding: 9px 24px;
    border: 0;
    border-radius: 10px;
    color: #2b1c00;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: .08em;
    background: linear-gradient(180deg, #ffe493, #f2b02a);
    box-shadow: 0 4px 0 #8a5a00, 0 10px 24px rgba(255, 210, 87, .2);
    cursor: pointer;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a00; }
  .btn:focus-visible { outline: 3px solid #fff3b0; outline-offset: 2px; }
  .btn.ghost {
    color: #cfe6ff;
    background: transparent;
    border: 2px solid rgba(94, 224, 255, .5);
    box-shadow: none;
    font-size: 14px;
    min-width: 120px;
  }
  .btn.ghost:active { transform: translateY(1px); }
  #btn-start { margin-top: 4px; }

  /* ---------------- 遊戲畫面 ---------------- */
  #scr-game { background: var(--bg0); }
  .hud {
    flex: 0 0 28px;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 64px 0 10px;
    overflow: hidden;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 700;
    background: linear-gradient(180deg, #131d38, #0c1326);
    border-bottom: 1px solid rgba(94, 224, 255, .18);
  }
  /* 狀態列右側的「重開本輪」：40px 觸控目標，浮在狀態列上緣，不佔用 28px 的列高 */
  .restart {
    position: absolute;
    top: 2px;
    right: 8px;
    z-index: 8;
    width: 52px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(94, 224, 255, .5);
    border-radius: 8px;
    background: rgba(9, 15, 29, .92);
    color: #ffe9a8;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .restart:active { transform: translateY(1px); }
  .restart:focus-visible { outline: 3px solid #fff3b0; outline-offset: 2px; }
  #hud-room { color: #d7e6ff; letter-spacing: .04em; }
  .hearts { font-size: 14px; line-height: 1; letter-spacing: 1px; }
  .hearts .on { color: #ff6f91; text-shadow: 0 0 8px rgba(255, 111, 145, .6); }
  .hearts .off { color: #402c44; }
  #hud-balls { color: var(--gold); letter-spacing: 2px; }
  #hud-balls b { font-weight: 900; }
  #hud-balls i { font-style: normal; color: #4c4527; }
  #hud-targets { color: var(--cyan); }
  .hud-note { color: #6b80a6; font-weight: 400; font-size: 11px; }
  .badges { display: flex; gap: 4px; margin-left: auto; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border: 1px solid rgba(94, 224, 255, .4);
    border-radius: 5px;
    color: #9fe9ff;
  }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #room { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  .tut {
    position: absolute;
    left: 8px;
    top: 16px;
    z-index: 4;
    max-width: min(250px, 46%);
    padding: 5px 10px;
    border: 1px solid rgba(94, 224, 255, .42);
    border-radius: 9px;
    background: rgba(8, 14, 28, .84);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 10.5px;
    line-height: 1.5;
    color: #d6e6ff;
    text-align: left;
    pointer-events: none;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .tut b { color: var(--gold); }
  .tut .k { color: var(--cyan); letter-spacing: .1em; }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px;
    text-align: center;
    background:
      linear-gradient(rgba(6, 10, 22, .86), rgba(5, 9, 19, .9)),
      url("art/floor.png");
    background-size: auto, 128px 128px;
    background-repeat: repeat;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .overlay::before {
    content: none;
  }
  .ov-title {
    margin: 0;
    font-size: clamp(14px, 4.6vh, 22px);
    letter-spacing: .1em;
    color: #ffe9a8;
    text-shadow: 0 0 18px rgba(255, 210, 87, .3);
  }
  .ov-sub { margin: 0; font-size: 11px; color: #a9bfe0; }
  .up-row { display: flex; gap: 8px; width: min(620px, 100%); }
  .up {
    flex: 1 1 0;
    min-width: 0;
    min-height: 58px;
    padding: 7px 8px;
    border: 2px solid rgba(94, 224, 255, .45);
    border-radius: 10px;
    background: linear-gradient(180deg, #172645, #0e1730);
    color: #e7f1ff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .up b { font-size: 15px; color: var(--gold); letter-spacing: .06em; }
  .up span { font-size: 10px; color: #a9bfe0; line-height: 1.3; }
  .up:active { transform: translateY(1px); border-color: var(--gold); }
  .up:focus-visible { outline: 3px solid #fff3b0; outline-offset: 2px; }
  .score {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: clamp(26px, 9vh, 48px);
    line-height: 1;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255, 210, 87, .45);
    font-variant-numeric: tabular-nums;
  }
  .score small { font-size: 12px; font-weight: 400; color: #9fb6d8; letter-spacing: 0; }
  .ov-actions { display: flex; gap: 8px; align-items: center; }
  .ov-actions .btn { min-width: 130px; font-size: 14px; }

  /* ---------------- 獨立開頁（非平台 iframe）：桌機上變成置中的大畫框 ---------------- */
  html:not(.dsh-embed) body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(90% 80% at 12% 0%, #15224a 0, transparent 55%),
      radial-gradient(80% 80% at 100% 100%, #2a2110 0, transparent 55%),
      #05080f;
    padding: 12px;
  }
  html:not(.dsh-embed) #app {
    width: min(1180px, 100%);
    height: min(760px, calc(100dvh - 24px));
    border: 1px solid rgba(94, 224, 255, .22);
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(0, 0, 0, .6);
  }

  /* ---------------- 平台 iframe（html.dsh-embed）：高度 292–706，絕不出現滾動 ---------------- */
  html.dsh-embed, html.dsh-embed body { height: 100%; min-height: 0; overflow: hidden; }
  html.dsh-embed #app { width: 100%; height: 100%; }

  /* 矮屏（874×292 / 932×384）：平台左上角有兩顆 34px 浮動鈕，佔左邊約 92px。
     狀態列往右讓開，重要資訊才不會被蓋住。 */
  @media (max-height: 400px) {
    html.dsh-embed .hud { padding-left: 92px; gap: 8px; }
    html.dsh-embed .start-inner { gap: 4px; }
    html.dsh-embed .mark { width: 44px; height: 33px; }
    html.dsh-embed .title { font-size: clamp(22px, 8.4vh, 34px); }
    html.dsh-embed .sub { font-size: 11px; }
    html.dsh-embed .hint { font-size: 10.5px; }
    html.dsh-embed .meta { font-size: 9.5px; }
    html.dsh-embed #btn-start { margin-top: 2px; }
    html.dsh-embed .overlay { gap: 5px; padding: 5px 8px; }
    html.dsh-embed .up { min-height: 52px; }
    html.dsh-embed .score { font-size: 26px; }
    html.dsh-embed .hero { height: 150px; right: 6px; opacity: .96; }
    html.dsh-embed .ov-hero { height: 118px; left: 10px; }
  }
  @media (max-width: 760px) {
    .hero { height: 110px; right: 2px; }
    .ov-hero { height: 90px; opacity: .38; }
  }
  @media (max-height: 340px) {
    html.dsh-embed .hero { height: 136px; right: 2px; opacity: .94; }
    html.dsh-embed .ov-hero { height: 96px; opacity: .9; }
  }
</style>
</head>
<body>
<div id="app">
  <section id="scr-start" class="screen active">
    <div class="start-inner">
      <svg class="mark" viewBox="0 0 64 48" aria-hidden="true">
        <path d="M32 4 L60 44 H4 Z" fill="none" stroke="#5ee0ff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M1 30 H27" stroke="#ffd257" stroke-width="3" stroke-linecap="round"/>
        <path d="M37 25 L63 11" stroke="#ffd257" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="34" r="4" fill="#ffd257"/>
      </svg>
      <p class="eyebrow">GEOMETRY RICOCHET</p>
      <h1 class="title">稜鏡迴廊</h1>
      <p class="sub">拖曳炮台、轉動鏡子，讓金球在牆與鏡之間反彈。</p>
      <div class="hints">
        <p class="hint"><i>1</i><span>在畫布上<b>拖曳瞄準</b>，放開就發射</span></p>
        <p class="hint"><i>2</i><span>點鏡座切換 <em>／ ＼ ｜ ─</em> 四種方向</span></p>
        <p class="hint"><i>3</i><span><b>入射角 = 反射角</b>，一顆球只能命中一個目標</span></p>
      </div>
      <button type="button" class="btn" id="btn-start">開始遊戲</button>
      <p class="meta">3 顆心 · 每間 2 顆球 · 一輪 6 間房 · 每球最多反彈 8 次 · 滿分 750</p>
    </div>
    <img class="hero" src="art/hero.png" alt="" aria-hidden="true"
         onload="this.classList.add('ready')" onerror="this.remove()">
  </section>

  <section id="scr-game" class="screen">
    <div class="hud">
      <span id="hud-room">第 1/6 間</span>
      <span class="hearts" id="hud-hearts"></span>
      <span id="hud-balls">球 ●●</span>
      <span id="hud-targets">目標 1/1</span>
      <span class="hud-note">反彈上限 8</span>
      <span class="badges" id="hud-badges"></span>
    </div>
    <button type="button" class="restart" id="btn-restart" aria-label="重開本輪" title="重開本輪">重開</button>
    <div class="stage" id="stage">
      <canvas id="room" aria-label="稜鏡迴廊遊戲畫面"></canvas>
      <div class="tut" id="tut" hidden>
        <div><b>拖曳</b>畫布瞄準，放開就發射</div>
        <div>點鏡座切換 <span class="k">／ ＼ ｜ ─</span></div>
        <div><b>入射角 = 反射角</b></div>
      </div>
      <div class="overlay" id="ov-up" hidden>
        <img class="hero ov-hero" src="art/hero.png" alt="" aria-hidden="true"
             onload="this.classList.add('ready')" onerror="this.remove()">
        <h2 class="ov-title" id="up-title">過關 · 選一個升級</h2>
        <p class="ov-sub">本輪永久生效</p>
        <div class="up-row" id="up-row"></div>
      </div>
      <div class="overlay" id="ov-end" hidden>
        <img class="hero ov-hero" src="art/hero.png" alt="" aria-hidden="true"
             onload="this.classList.add('ready')" onerror="this.remove()">
        <h2 class="ov-title" id="end-title">本輪結束</h2>
        <p class="ov-sub" id="end-sub"></p>
        <div class="score"><span id="end-score">0</span><small>/ 750</small></div>
        <div class="ov-actions">
          <button type="button" class="btn" id="btn-again">再來一輪</button>
          <button type="button" class="btn ghost" id="btn-home">回開始</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     RIC-CORE：純物理（不碰 DOM）。offline 求解器 tools/ric-solve.js
     會直接抽出這一段，和遊戲共用同一份程式，確保「證明可解」不是另一套。
     ===================================================================== */
  /* RIC-CORE-BEGIN */
  var RIC = {
    PAD: 12,          // 房間邊牆厚度
    BALL_R: 6,
    TARGET_R: 12,
    SPEED: 520,
    SLOW: 380,
    MAX_BOUNCE: 8,
    BARREL: 34,       // 炮管長度（球從炮口出生）
    LEN: 30,          // 鏡面半長（總長 60）
    GLYPHS: ["／", "＼", "｜", "─"],

    unit: function (d) {
      d = ((d % 4) + 4) % 4;
      if (d === 0) return { x: 0.70710678, y: -0.70710678 }; // ／
      if (d === 1) return { x: 0.70710678, y: 0.70710678 };  // ＼
      if (d === 2) return { x: 0, y: 1 };                    // ｜
      return { x: 1, y: 0 };                                 // ─
    },

    muzzle: function (level, deg) {
      var a = deg * Math.PI / 180;
      return {
        x: level.cannon.x + Math.cos(a) * this.BARREL,
        y: level.cannon.y - Math.sin(a) * this.BARREL
      };
    },

    /* 推進一顆球一小步；回傳事件陣列（bounce / hit / die）。
       事件裡的 vx,vy 是「已反射後」的速度，稜鏡分裂會用到。 */
    stepBall: function (b, level, mirrors, targets, dt) {
      var ev = [];
      var R = RIC.BALL_R;
      var minX = RIC.PAD + R, maxX = level.w - RIC.PAD - R;
      var minY = RIC.PAD + R, maxY = level.h - RIC.PAD - R;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      function pushBounce(x, y, kind) {
        b.bounces++;
        ev.push({ type: "bounce", x: x, y: y, kind: kind, n: b.bounces, vx: b.vx, vy: b.vy });
        if (b.bounces > RIC.MAX_BOUNCE) {
          b.dead = true;
          ev.push({ type: "die", x: x, y: y });
        }
      }

      /* 目標先判定：一球只吃一個目標 */
      for (var ti = 0; ti < targets.length; ti++) {
        var tg = targets[ti];
        if (!tg || tg.alive === false) continue;
        var tdx = b.x - tg.x, tdy = b.y - tg.y;
        var tr = R + RIC.TARGET_R;
        if (tdx * tdx + tdy * tdy <= tr * tr) {
          b.dead = true;
          ev.push({ type: "hit", x: tg.x, y: tg.y, idx: ti });
          return ev;
        }
      }

      /* 房間四邊 */
      if (b.x < minX) {
        b.x = minX;
        if (b.vx < 0) { b.vx = -b.vx; pushBounce(minX, b.y, "edge"); }
      } else if (b.x > maxX) {
        b.x = maxX;
        if (b.vx > 0) { b.vx = -b.vx; pushBounce(maxX, b.y, "edge"); }
      }
      if (b.y < minY) {
        b.y = minY;
        if (b.vy < 0) { b.vy = -b.vy; pushBounce(b.x, minY, "edge"); }
      } else if (b.y > maxY) {
        b.y = maxY;
        if (b.vy > 0) { b.vy = -b.vy; pushBounce(b.x, maxY, "edge"); }
      }
      if (b.dead) return ev;

      /* 室內牆：圓 vs AABB */
      var walls = level.walls || [];
      for (var wi = 0; wi < walls.length; wi++) {
        var r = walls[wi];
        var cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
        var cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
        var dx = b.x - cx, dy = b.y - cy;
        var d2 = dx * dx + dy * dy;
        if (d2 >= R * R) continue;
        if (d2 > 0.000001) {
          var d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
          b.x = cx + ux * (R + 0.5);
          b.y = cy + uy * (R + 0.5);
          var vn = b.vx * ux + b.vy * uy;
          if (vn < 0) {
            b.vx -= 2 * vn * ux;
            b.vy -= 2 * vn * uy;
            pushBounce(cx, cy, "wall");
          }
        } else {
          var l = b.x - r.x, rr = r.x + r.w - b.x, t = b.y - r.y, bb = r.y + r.h - b.y;
          var m = Math.min(l, rr, t, bb);
          if (m === l) { b.x = r.x - R - 0.5; b.vx = -Math.abs(b.vx); }
          else if (m === rr) { b.x = r.x + r.w + R + 0.5; b.vx = Math.abs(b.vx); }
          else if (m === t) { b.y = r.y - R - 0.5; b.vy = -Math.abs(b.vy); }
          else { b.y = r.y + r.h + R + 0.5; b.vy = Math.abs(b.vy); }
          pushBounce(b.x, b.y, "wall");
        }
        if (b.dead) return ev;
      }

      /* 鏡面：線段（兩端圓角），反射後推出 */
      for (var mi = 0; mi < mirrors.length; mi++) {
        var mm = mirrors[mi];
        var u = RIC.unit(mm.d);
        var rx = b.x - mm.x, ry = b.y - mm.y;
        var along = rx * u.x + ry * u.y;
        var perp = -rx * u.y + ry * u.x;
        if (Math.abs(along) > RIC.LEN + R) continue;
        if (Math.abs(perp) > R) continue;
        var nx, ny;
        if (perp >= 0) { nx = -u.y; ny = u.x; } else { nx = u.y; ny = -u.x; }
        var vn2 = b.vx * nx + b.vy * ny;
        if (vn2 >= 0) continue;
        b.x += nx * (R - Math.abs(perp) + 0.6);
        b.y += ny * (R - Math.abs(perp) + 0.6);
        b.vx -= 2 * vn2 * nx;
        b.vy -= 2 * vn2 * ny;
        var cAlong = Math.max(-RIC.LEN, Math.min(RIC.LEN, along));
        pushBounce(mm.x + u.x * cAlong, mm.y + u.y * cAlong, "mirror");
        if (b.dead) return ev;
      }
      return ev;
    },

    /* 離線求解／透視預覽用：丟一顆球並回傳軌跡 */
    simShot: function (level, mirrors, deg, targets, speed, maxBounces) {
      var m = RIC.muzzle(level, deg);
      var a = deg * Math.PI / 180;
      var sp = speed || RIC.SPEED;
      var b = {
        x: m.x, y: m.y,
        vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp,
        bounces: 0, dead: false
      };
      var path = [{ x: b.x, y: b.y, kind: "start" }];
      var hit = -1, hitX = 0, hitY = 0;
      var steps = 0;
      var stopAt = maxBounces || 0;
      while (!b.dead && steps < 2400) {
        var ev = RIC.stepBall(b, level, mirrors, targets, 1 / 240);
        steps++;
        for (var i = 0; i < ev.length; i++) {
          var e = ev[i];
          if (e.type === "bounce") {
            path.push({ x: e.x, y: e.y, kind: e.kind, n: e.n });
            if (stopAt && e.n >= stopAt) { b.dead = true; }
          } else if (e.type === "hit") {
            hit = e.idx; hitX = e.x; hitY = e.y;
          }
        }
        if (hit >= 0) break;
      }
      return { hit: hit, hitX: hitX, hitY: hitY, bounces: b.bounces, path: path, endX: b.x, endY: b.y };
    }
  };

      im.src = ART_SRC[key];
      ART[key] = im;
    });

  /* 用世界座標的 tile 尺寸平鋪圖樣；pattern 會跟著 CTM 縮放 */
  function fillTile(pattern, x, y, w, h, tile) {
    if (!pattern) return false;
    var s = tile / ART_PX;
    ctx.save();
    ctx.scale(s, s);
    ctx.fillStyle = pattern;
    ctx.fillRect(x / s, y / s, w / s, h / s);
    ctx.restore();
    return true;
  }

  function speed() { return G.run && G.run.upgrades.slow ? RIC.SLOW : RIC.SPEED; }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }

  /* ---------------- 版面 ---------------- */
  function resize() {
    var r = stageEl.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    cssW = r.width;
    cssH = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    var pw = Math.max(1, Math.round(cssW * dpr));
    var ph = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
    }
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    updateView();
  }

  function updateView() {
    var L = G.room && G.room.level;
    if (!L) { scale = 1; ox = 0; oy = 0; return; }
    scale = Math.min(cssW / L.w, cssH / L.h);
    ox = (cssW - L.w * scale) / 2;
    oy = (cssH - L.h * scale) / 2;
  }

  /* ---------------- HUD ---------------- */

  /* ---------------- 教學 ---------------- */

  function hideTut() {

  /* ---------------- 流程 ---------------- */
  function showScreen(name) {

    document.getElementById("scr-game").classList.toggle("active", name === "game");
    if (name === "game") requestAnimationFrame(resize);

  function pickRooms() {
    var idx = [];
    for (var i = 0; i < LEVELS.length; i++) idx.push(i);
    shuffle(idx);
    var pick = idx.slice(0, 6);
    pick.sort(function (a, b) { return a - b; }); // 難度由淺到深
    return pick;
  }

  function startRun() {
    G.run = {
      rooms: pickRooms(),
      idx: 0,
      hearts: 3,

    ovUp.hidden = true;
    showScreen("game");
    startRoom();
  }

  function startRoom() {
    var L = LEVELS[G.run.rooms[G.run.idx]];
    var total = L.balls + G.run.upgrades.ball;
    G.room = {
      level: L,
      mirrors: L.mirrors.map(function (m) { return { x: m.x, y: m.y, d: m.d, flash: 0, pop: 0 }; }),
      targets: L.targets.map(function (t) { return { x: t.x, y: t.y, alive: true }; }),
      ballsLeft: total,
      ballsTotal: total
    };
    G.balls = [];
    G.effects = [];
    G.banner = null;
    G.acc = 0;
    G.wait = 0;
    G.pending = null;
    G.allDown = false;
    G.mode = "aim";
    ovUp.hidden = true;
    btnRestart.hidden = false;

    resize();

  function resetRoom() {
    var room = G.room;
    if (!room) return;
    for (var i = 0; i < room.targets.length; i++) room.targets[i].alive = true;
    room.ballsLeft = room.ballsTotal;
    G.balls = [];
    G.effects = [];
    G.banner = null;
    G.acc = 0;
    G.mode = "aim";
    G.allDown = false;
    btnRestart.hidden = false;
    updateHud();
  }

  function fire() {
    if (!G.room || G.mode !== "aim" || G.balls.length) return;
    if (G.room.ballsLeft <= 0) return;
    var L = G.room.level;
    var m = RIC.muzzle(L, G.angle);
    var a = G.angle * Math.PI / 180;
    var sp = speed();
    G.balls.push({
      x: m.x, y: m.y,
      vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp,
      bounces: 0, dead: false, split: false,
      trail: [{ x: m.x, y: m.y }], tick: 0
    });
    G.room.ballsLeft--;
    G.mode = "flight";
    G.acc = 0;
    G.recoil = 0.18;
    addFx("muzzle", m.x, m.y, { dur: 0.2 });
    updateHud();
    hideTut();
  }

  function addFx(kind, x, y, extra) {
    var o = { kind: kind, x: x, y: y, t: 0, dur: 0.6 };
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) o[k] = extra[k];
    G.effects.push(o);
    if (G.effects.length > 48) G.effects.shift();
  }

  function onBounce(b, e) {
    addFx("reflect", e.x, e.y, { dur: 0.55 });
    if (G.run.upgrades.prism && !b.split && (e.kind === "edge" || e.kind === "wall")) {
      b.split = true;
      var sp = speed();
      var len = Math.sqrt(e.vx * e.vx + e.vy * e.vy) || 1;
      G.balls.push({
        x: e.x, y: e.y,
        vx: -e.vx / len * sp,
        vy: -e.vy / len * sp,
        bounces: 0, dead: false, split: true,
        trail: [{ x: e.x, y: e.y }], tick: 0
      });
      addFx("prism", e.x, e.y, { dur: 0.75 });
    }
  }

  function onHit(b, e) {
    var tg = G.room.targets[e.idx];
    if (tg && tg.alive) tg.alive = false;
    addFx("hit", e.x, e.y, { dur: 1.1, deg: Math.round(G.angle) });
    updateHud();
    var left = 0;
    for (var i = 0; i < G.room.targets.length; i++) if (G.room.targets[i].alive) left++;
    // 最後一個目標打中就過關；還在飛的稜鏡分身不用等，直接收掉。
    if (!left) G.allDown = true;
  }

  function stepWorld(h) {
    var room = G.room;
    for (var i = G.balls.length - 1; i >= 0; i--) {
      var b = G.balls[i];
      b.tick++;
      var ev = RIC.stepBall(b, room.level, room.mirrors, room.targets, h);
      for (var k = 0; k < ev.length; k++) {
        var e = ev[k];
        if (e.type === "bounce") onBounce(b, e);
        else if (e.type === "hit") onHit(b, e);
      }
      if (G.allDown) break;
      if (b.tick % 7 === 0) {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 6) b.trail.shift();
      }
      if (b.dead) G.balls.splice(i, 1);
    }
    if (G.allDown) {
      G.allDown = false;
      G.balls = [];
      G.mode = "wait";
      G.pending = "clear";
      G.wait = 0.45;
      G.banner = { text: "過關", sub: "", t: 0, dur: 0.9 };
      return;
    }
    if (G.mode === "flight" && !G.balls.length) afterFlight();
  }

  function afterFlight() {
    var left = 0;
    for (var i = 0; i < G.room.targets.length; i++) if (G.room.targets[i].alive) left++;
    if (!left) {
      G.mode = "wait";
      G.pending = "clear";
      G.wait = 0.8;
      G.banner = { text: "過關", sub: "", t: 0, dur: 0.9 };
    } else if (G.room.ballsLeft <= 0) {
      G.mode = "wait";
      G.pending = "lose";
      G.wait = 1.0;
      G.banner = { text: "球用完了", sub: "扣 1 顆心", t: 0, dur: 1.2, bad: true };
    } else {
      G.mode = "aim";
    }
  }

  function clearRoom() {
    G.run.cleared++;
    G.banner = null;
    if (G.run.idx >= G.run.rooms.length - 1) { endRun(true); return; }
    showUpgrade();
  }

  function loseHeart() {
    G.run.hearts--;
    updateHud();
    if (G.run.hearts <= 0) { endRun(false); return; }
    G.banner = { text: "失去 1 顆心", sub: "同一間房重新開始", t: 0, dur: 1.4, bad: true };
    G.mode = "wait";
    G.pending = "reset";
    G.wait = 1.4;
  }

  function showUpgrade() {
    G.mode = "upgrade";
    btnRestart.hidden = true;
    // 永遠有 ball + heart 兩張不同卡；slow / xray / prism 拿過就不再出現。
    var pool = ["ball", "heart"];
    if (!G.run.upgrades.slow) pool.push("slow");
    if (!G.run.upgrades.xray) pool.push("xray");
    if (!G.run.upgrades.prism) pool.push("prism");
    shuffle(pool);
    var picks = pool.slice(0, 2);
    G.upPicks = picks;
    var row = document.getElementById("up-row");
    row.replaceChildren();
    picks.forEach(function (k) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "up";
      btn.dataset.k = k;
      var t = document.createElement("b");
      t.textContent = UP_INFO[k].title;
      var s = document.createElement("span");
      s.textContent = UP_INFO[k].desc;
      btn.appendChild(t);
      btn.appendChild(s);
      btn.addEventListener("click", function () { chooseUpgrade(k); });
      row.appendChild(btn);
    });
    document.getElementById("up-title").textContent = "第 " + (G.run.idx + 1) + " 間過關 · 選一個升級";
    ovUp.hidden = false;
  }

  function chooseUpgrade(k) {
    if (G.mode !== "upgrade") return;
    if (k === "ball") {
      G.run.upgrades.ball++;
    } else if (k === "heart") {
      // 滿心時轉為多一顆球，避免出現無效選項
      if (G.run.hearts < 3) G.run.hearts++;
      else G.run.upgrades.ball++;
    } else {
      G.run.upgrades[k] = true;
    }
    ovUp.hidden = true;
    G.run.idx++;
    startRoom();
  }

  function endRun(win) {
    G.mode = "over";
    btnRestart.hidden = true;
    hideTut();
    var score = G.run.cleared * 100 + G.run.hearts * 50;
    G.run.score = score;
    document.getElementById("end-title").textContent = win ? "全數通過！" : "本輪結束";
    document.getElementById("end-sub").textContent =
      "通過 " + G.run.cleared + " / 6 間 · 剩餘 " + G.run.hearts + " 顆心";
    document.getElementById("end-score").textContent = String(score);
    ovEnd.hidden = false;
    reportScore(score);
  }

  function reportScore(score) {
    try {
      parent.postMessage({ type: "game-score", score: score }, location.origin);
    } catch (e) { /* ignore */ }
  }

  /* ---------------- 輸入 ---------------- */
  function canvasPoint(e) {
    var r = canvas.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    return { x: (cx - ox) / scale, y: (cy - oy) / scale, cx: cx, cy: cy };
  }

  function nearestMirror(p) {
    if (!G.room) return -1;
    var best = -1, bd = 1e9;
    for (var i = 0; i < G.room.mirrors.length; i++) {
      var m = G.room.mirrors[i];
      var u = RIC.unit(m.d);
      var rx = p.x - m.x, ry = p.y - m.y;
      var along = Math.max(-RIC.LEN, Math.min(RIC.LEN, rx * u.x + ry * u.y));
      var dx = rx - u.x * along, dy = ry - u.y * along;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bd) { bd = d; best = i; }
    }
    return bd <= 48 ? best : -1;
  }

  function setAngleFromPoint(p) {
    if (!G.room) return;
    var c = G.room.level.cannon;
    var dx = p.x - c.x, dy = c.y - p.y;
    var a = Math.atan2(dy, dx) * 180 / Math.PI;
    if (a > 85) a = 85;
    if (a < -85) a = -85;
    G.angle = a;
  }

  function toggleMirror(i) {
    if (!G.room || G.mode !== "aim") return;
    var m = G.room.mirrors[i];
    if (!m) return;
    m.d = (m.d + 1) % 4;
    m.flash = 0.55;
    m.pop = 0.12;   // 120ms 縮放回饋
    addFx("toggle", m.x, m.y, { dur: 0.5 });
    hideTut();
  }

  function onDown(e) {
    if (!G.room || G.mode !== "aim") return;
    e.preventDefault();
    var p = canvasPoint(e);
    G.aim = {
      active: true,
      dragging: false,
      mirror: nearestMirror(p),
      startCX: p.cx,
      startCY: p.cy,
      pid: e.pointerId
    };
    if (G.aim.mirror < 0) setAngleFromPoint(p);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onMove(e) {
    if (!G.aim.active) return;
    if (e.pointerId !== G.aim.pid) return;
    var p = canvasPoint(e);
    var dx = p.cx - G.aim.startCX, dy = p.cy - G.aim.startCY;
    if (!G.aim.dragging && dx * dx + dy * dy > 64) {
      G.aim.dragging = true;
      G.aim.mirror = -1;
    }
    if (G.aim.dragging) setAngleFromPoint(p);
  }

  function onUp(e) {
    if (!G.aim.active) return;
    var was = G.aim;
    G.aim.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (was.mirror >= 0 && !was.dragging) {
      toggleMirror(was.mirror);
      return;
    }
    if (!was.dragging) setAngleFromPoint(canvasPoint(e));
    fire();
  }

  canvas.addEventListener("pointerdown", onDown, { passive: false });
  canvas.addEventListener("pointermove", onMove, { passive: false });
  canvas.addEventListener("pointerup", onUp, { passive: false });
  canvas.addEventListener("pointercancel", function () { G.aim.active = false; });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (G.screen !== "game" || G.mode !== "aim" || !G.room) return;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") {
      G.angle = Math.min(85, G.angle + 1);
      e.preventDefault();
    } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
      G.angle = Math.max(-85, G.angle - 1);
      e.preventDefault();
    } else if (e.key === " " || e.key === "Enter") {
      fire();
      e.preventDefault();
    } else if (e.key === "m" || e.key === "M") {
      if (G.room.mirrors.length) toggleMirror(0);
    }
  });

  document.getElementById("btn-start").addEventListener("click", function () {
    this.blur();
    startRun();
  });
  document.getElementById("btn-again").addEventListener("click", function () {
    this.blur();
    startRun();
  });
  btnRestart.addEventListener("click", function () {
    this.blur();
    startRun();
  });
  document.getElementById("btn-home").addEventListener("click", function () {
    G.mode = "idle";
    G.room = null;
    G.balls = [];
    ovEnd.hidden = true;
    ovUp.hidden = true;
    showScreen("start");
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 180); });
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (G.screen === "game") resize(); }).observe(stageEl);
  }

  /* ---------------- 更新 ---------------- */
  function update(dt) {
    var i;
    if (G.recoil > 0) G.recoil = Math.max(0, G.recoil - dt);
    for (i = G.effects.length - 1; i >= 0; i--) {
      G.effects[i].t += dt;
      if (G.effects[i].t >= G.effects[i].dur) G.effects.splice(i, 1);
    }
    if (G.banner) {
      G.banner.t += dt;
      if (G.banner.t >= G.banner.dur) G.banner = null;
    }
    if (G.room) {
      for (i = 0; i < G.room.mirrors.length; i++) {
        var mm = G.room.mirrors[i];
        if (mm.flash > 0) mm.flash -= dt;
        if (mm.pop > 0) mm.pop = Math.max(0, mm.pop - dt);
      }
    }
    if (G.mode === "wait") {
      G.wait -= dt;
      if (G.wait <= 0) {
        var p = G.pending;
        G.pending = null;
        if (p === "clear") clearRoom();
        else if (p === "lose") loseHeart();
        else if (p === "reset") resetRoom();
      }
    }
    if (G.mode === "flight") {
      G.acc += dt;
      var guard = 0;
      while (G.acc >= STEP && guard++ < 90) {
        stepWorld(STEP);
        G.acc -= STEP;
        if (G.mode !== "flight") break;
      }
    }
  }

  /* ---------------- 繪圖 ---------------- */
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    var L = G.room && G.room.level;
    if (!L) {
      var bg = ctx.createLinearGradient(0, 0, 0, cssH);
      bg.addColorStop(0, "#0b1226");
      bg.addColorStop(1, "#070b16");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, cssW, cssH);
      return;
    }
    var key = [cssW, cssH, dpr, scale, ox, oy, L.id, ART_EPOCH].join(":");
    if (key !== BG.key) {
      BG.key = key;
      renderBase(L);
    }
    ctx.drawImage(BG.canvas, 0, 0, BG.canvas.width / dpr, BG.canvas.height / dpr);
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    drawRoomLive(L, G.t);
    drawFrame(L);
    ctx.restore();
  }

  /* 靜態底圖只畫一次：背景 + 地板 + 牆，之後每幀只 drawImage */
  function renderBase(L) {
    var c = BG.canvas;
    var pw = Math.max(1, Math.round(cssW * dpr));
    var ph = Math.max(1, Math.round(cssH * dpr));
    if (c.width !== pw || c.height !== ph) {
      c.width = pw;
      c.height = ph;
    }
    var out = ctx;
    ctx = BG.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cssW, cssH);

    var bg = ctx.createLinearGradient(0, 0, 0, cssH);
    bg.addColorStop(0, "#0b1226");
    bg.addColorStop(1, "#070b16");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssW, cssH);

    drawBackdrop();

    // 房間浮在石廊上的投影
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.78)";
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 10;
    ctx.fillStyle = "#060a14";
    ctx.fillRect(ox - 2, oy - 2, L.w * scale + 4, L.h * scale + 4);
    ctx.restore();

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    drawFloor(L);
    drawWalls(L);
    ctx.restore();
    ctx = out;
  }

  function drawBackdrop() {
    if (PAT.wall) {
      // 3:1 房間上下留白也有石材質感
      ctx.save();
      ctx.globalAlpha = .2;
      ctx.fillStyle = PAT.wall;
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.fillStyle = "rgba(5,9,19,.72)";
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.restore();
    }
    var g = ctx.createRadialGradient(cssW * 0.5, cssH * 0.32, 0, cssW * 0.5, cssH * 0.32, Math.max(cssW, cssH) * 0.72);
    g.addColorStop(0, "rgba(38,70,120,.32)");
    g.addColorStop(1, "rgba(6,10,20,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.strokeStyle = "rgba(94,224,255,.04)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < cssW; x += 48) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, cssH);
    }
    ctx.stroke();
  }

  function drawFloor(L) {
    // 地板：像素磚平鋪（載入失敗就退回原本的漸層 + 細格線）
    if (!fillTile(PAT.floor, 0, 0, L.w, L.h, FLOOR_TILE)) {
      var g = ctx.createLinearGradient(0, 0, 0, L.h);
      g.addColorStop(0, "#14203f");
      g.addColorStop(0.55, "#101a33");
      g.addColorStop(1, "#0c1427");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, L.w, L.h);

      ctx.strokeStyle = "rgba(94,224,255,.06)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 60; gx < L.w; gx += 60) { ctx.moveTo(gx, 0); ctx.lineTo(gx, L.h); }
      for (var gy = 60; gy < L.h; gy += 60) { ctx.moveTo(0, gy); ctx.lineTo(L.w, gy); }
      ctx.stroke();
    }

    // 壓暗一層，讓地板紋理低調、物件跳出來
    ctx.fillStyle = "rgba(7,13,27,.30)";
    ctx.fillRect(0, 0, L.w, L.h);

    var rg = ctx.createRadialGradient(L.w * 0.5, -40, 0, L.w * 0.5, -40, L.w * 0.8);
    rg.addColorStop(0, "rgba(94,224,255,.15)");
    rg.addColorStop(1, "rgba(94,224,255,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, L.w, L.h);

    var vg = ctx.createRadialGradient(L.w * 0.5, L.h * 0.46, L.h * 0.15, L.w * 0.5, L.h * 0.5, L.w * 0.62);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(2,5,13,.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, L.w, L.h);
  }

  function drawRoomLive(L, t) {
    drawMirrors(L, t);
    drawTargets(L, t);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, L.w, L.h);
    ctx.clip();
    drawAimGuide(L);
    drawXray(L);
    drawCannon(L, t);
    drawBalls(L);
    drawEffects(L);
    drawBanner();
    ctx.restore();
  }

  function drawWalls(L) {
    for (var i = 0; i < L.walls.length; i++) {
      var r = L.walls[i];
      // 牆落在這塊地板上：先鋪一層投影
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 11;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 5;
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.restore();
      if (!fillTile(PAT.wall, r.x, r.y, r.w, r.h, WALL_TILE)) {
        ctx.fillStyle = "#1f2f55";
        ctx.fillRect(r.x, r.y, r.w, r.h);
        var g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
        g.addColorStop(0, "rgba(94,224,255,.18)");
        g.addColorStop(0.5, "rgba(94,224,255,.03)");
        g.addColorStop(1, "rgba(0,0,0,.18)");
        ctx.fillStyle = g;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = "#3d5687";
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
        ctx.fillStyle = "rgba(255,210,87,.18)";
        ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, 2);
      }
      // 3px 內陰影 + 上緣高光，讓牆磚有厚度
      ctx.save();
      ctx.beginPath();
      ctx.rect(r.x, r.y, r.w, r.h);
      ctx.clip();
      ctx.strokeStyle = "rgba(3,6,14,.6)";
      ctx.lineWidth = 6;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = "rgba(94,224,255,.14)";
      ctx.fillRect(r.x, r.y, r.w, 2);
      ctx.fillStyle = "rgba(255,210,87,.10)";
      ctx.fillRect(r.x, r.y + r.h - 2, r.w, 2);
      ctx.restore();
      ctx.strokeStyle = "rgba(94,224,255,.22)";
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, Math.max(0, r.w - 1), Math.max(0, r.h - 1));
    }
  }

  function drawMirrors(L, t) {
    var room = G.room;
    var drawW = 84;
    for (var i = 0; i < room.mirrors.length; i++) {
      var m = room.mirrors[i];
      var u = RIC.unit(m.d);
      var ang = Math.atan2(u.y, u.x);
      var pop = m.pop > 0 ? Math.sin(Math.PI * (1 - m.pop / 0.12)) : 0;
      var sc = 1 + pop * 0.26;
      var img = art("mirror");

      // 鏡面光暈（脈動）
      var gl = ctx.createRadialGradient(m.x, m.y, 2, m.x, m.y, 46);
      gl.addColorStop(0, "rgba(94,224,255," + (0.18 + Math.sin(t * 2.2 + i) * 0.05 + (m.flash > 0 ? 0.22 : 0)).toFixed(3) + ")");
      gl.addColorStop(1, "rgba(94,224,255,0)");
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 46, 0, TAU);
      ctx.fill();

      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(ang);
      ctx.scale(sc, sc);
      if (m.d === 0) ctx.scale(1, -1);   // ／ 鏡像
      if (img) {
        ctx.drawImage(img, -drawW / 2, -drawW / 2, drawW, drawW);
      } else {
        // 向量備援：原本的雙線鏡面
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(94,224,255,.16)";
        ctx.lineWidth = 15;
        ctx.beginPath(); ctx.moveTo(-RIC.LEN, 0); ctx.lineTo(RIC.LEN, 0); ctx.stroke();
        ctx.strokeStyle = "#5ee0ff";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-RIC.LEN, 0); ctx.lineTo(RIC.LEN, 0); ctx.stroke();
        ctx.strokeStyle = "rgba(240,255,255,.9)";
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-RIC.LEN, 0); ctx.lineTo(RIC.LEN, 0); ctx.stroke();
      }
      ctx.restore();

      if (!img) {
        ctx.beginPath();
        ctx.arc(m.x, m.y, 11, 0, TAU);
        ctx.fillStyle = "#08202f";
        ctx.fill();
        ctx.strokeStyle = "#5ee0ff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#c8f6ff";
        ctx.font = "bold 15px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(RIC.GLYPHS[m.d], m.x, m.y + 1);
      }

      if (m.flash > 0) {
        ctx.strokeStyle = "rgba(255,210,87," + Math.min(1, m.flash * 1.7).toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 15 + (0.55 - m.flash) * 30, 0, TAU);
        ctx.stroke();
      }
    }
  }

  function drawTargets(L, t) {
    var room = G.room;
    var img = art("target");
    for (var i = 0; i < room.targets.length; i++) {
      var tg = room.targets[i];
      if (!tg.alive) continue;
      var bob = Math.sin(t * Math.PI) * 4;           // 上下浮動 ±4，2 秒一週期
      var pulse = 1 + Math.sin(t * 2.6 + i * 1.7) * 0.06;
      ctx.save();
      ctx.translate(tg.x, tg.y + bob);
      var rg = ctx.createRadialGradient(0, 0, 2, 0, 0, 54);
      rg.addColorStop(0, "rgba(94,224,255," + (0.4 + Math.sin(t * 2.6 + i * 1.7) * 0.12).toFixed(3) + ")");
      rg.addColorStop(0.55, "rgba(94,224,255,.11)");
      rg.addColorStop(1, "rgba(94,224,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.fill();

      if (img) {
        var d = 62 * pulse;
        ctx.drawImage(img, -d / 2, -d / 2, d, d);
      } else {
        // 向量備援：原本的同心圓 + 旋轉光芒
        ctx.strokeStyle = "#ffd257";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 12 * pulse, 0, TAU); ctx.stroke();
        ctx.strokeStyle = "rgba(255,210,87,.5)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 18 * pulse, 0, TAU); ctx.stroke();
        ctx.strokeStyle = "rgba(255,240,190,.85)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var k = 0; k < 4; k++) {
          var a = t * 0.7 + k * Math.PI / 2;
          ctx.moveTo(Math.cos(a) * 21, Math.sin(a) * 21);
          ctx.lineTo(Math.cos(a) * 26, Math.sin(a) * 26);
        }
        ctx.stroke();
        ctx.fillStyle = "#fff3c9";
        ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
      }

      // 一圈細細的環，脈動光暈
      ctx.strokeStyle = "rgba(160,245,255," + (0.18 + Math.sin(t * 2.6 + i * 1.7) * 0.08).toFixed(3) + ")";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, (img ? 32 : 24) * pulse, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawAimGuide(L) {
    if (G.mode !== "aim") return;
    var m = RIC.muzzle(L, G.angle);
    var a = G.angle * Math.PI / 180;
    ctx.save();
    ctx.setLineDash([5, 9]);
    ctx.strokeStyle = "rgba(255,210,87,.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x + Math.cos(a) * 110, m.y - Math.sin(a) * 110);
    ctx.stroke();
    ctx.restore();
  }

  function drawXray(L) {
    if (!G.run.upgrades.xray || G.mode !== "aim" || !G.room) return;
    var res = RIC.simShot(L, G.room.mirrors, G.angle, G.room.targets, speed(), 2);
    var pts = res.path.slice();
    if (res.hit >= 0) pts.push({ x: res.hitX, y: res.hitY, kind: "hit" });
    if (pts.length < 2) return;
    var n = Math.min(2, pts.length - 1);
    ctx.save();
    ctx.setLineDash([10, 10]);
    ctx.lineDashOffset = -(G.t * 26) % 20;
    ctx.strokeStyle = "rgba(94,224,255,.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i <= n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    var last = pts[n];
    ctx.strokeStyle = "rgba(94,224,255,.75)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(last.x, last.y, 5, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawCannon(L, t) {
    var c = L.cannon;
    var a = G.angle * Math.PI / 180;
    var img = art("cannon");
    var kick = G.recoil > 0 ? Math.sin(Math.PI * (G.recoil / 0.18)) * 6 : 0;

    ctx.save();
    ctx.strokeStyle = "rgba(255,210,87,.22)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 46, 0, -a, a > 0);
    ctx.stroke();

    var rg = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, 58);
    rg.addColorStop(0, "rgba(255,210,87,.28)");
    rg.addColorStop(1, "rgba(255,210,87,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(c.x, c.y, 58, 0, TAU); ctx.fill();

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(-a);
    if (img) {
      var cw = 86;
      ctx.drawImage(img, -4 - cw / 2 - kick, -cw / 2, cw, cw);
      // 炮口的光，發射瞬間最亮
      var mg = ctx.createRadialGradient(RIC.BARREL, 0, 0, RIC.BARREL, 0, 18);
      var ma = 0.18 + (G.recoil > 0 ? (G.recoil / 0.18) * 0.7 : 0);
      mg.addColorStop(0, "rgba(255,250,215," + ma.toFixed(3) + ")");
      mg.addColorStop(0.4, "rgba(255,210,87," + (ma * 0.5).toFixed(3) + ")");
      mg.addColorStop(1, "rgba(255,210,87,0)");
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(RIC.BARREL, 0, 18, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = "#c99a24";
      rrect(-kick, -7, RIC.BARREL + 12, 14, 7);
      ctx.fill();
      ctx.fillStyle = "#ffd257";
      rrect(1 - kick, -5.5, RIC.BARREL + 10, 11, 5.5);
      ctx.fill();
      ctx.fillStyle = "#fff0bd";
      rrect(4 - kick, -2.8, RIC.BARREL + 3, 5.6, 2.8);
      ctx.fill();
      ctx.strokeStyle = "#ffe9a8";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(RIC.BARREL + 7 - kick, 0, 7, 0, TAU); ctx.stroke();
    }
    ctx.restore();

    if (!img) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 16, 0, TAU);
      ctx.fillStyle = "#182746";
      ctx.fill();
      ctx.strokeStyle = "#ffd257";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 7, 0, TAU);
      ctx.fillStyle = "#5ee0ff";
      ctx.fill();
    }
    ctx.restore();

    var txt = "角度 " + Math.round(G.angle) + "°";
    ctx.font = "bold 20px " + FONT;
    var w = ctx.measureText(txt).width + 22;
    var px = c.x + 28, py = c.y - 72;
    if (px + w > L.w - 20) px = L.w - 20 - w;
    if (py < 18) py = 18;
    ctx.fillStyle = "rgba(8,14,28,.8)";
    rrect(px, py, w, 30, 9);
    ctx.fill();
    ctx.strokeStyle = "rgba(94,224,255,.4)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#ffe9a8";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(txt, px + 11, py + 16);
  }

  function drawBalls(L) {
    for (var i = 0; i < G.balls.length; i++) {
      var b = G.balls[i];
      var tr = b.trail;
      // 最近 6 個位置的淡出拖尾
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (var k = 1; k < tr.length; k++) {
        var f = k / tr.length;
        ctx.strokeStyle = "rgba(255,214,96," + (0.05 + 0.38 * f * f).toFixed(3) + ")";
        ctx.lineWidth = 1.5 + 8 * f;
        ctx.beginPath();
        ctx.moveTo(tr[k - 1].x, tr[k - 1].y);
        ctx.lineTo(tr[k].x, tr[k].y);
        ctx.stroke();
      }
      ctx.restore();
      var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 26);
      rg.addColorStop(0, "rgba(255,236,160,.85)");
      rg.addColorStop(0.35, "rgba(255,210,87,.42)");
      rg.addColorStop(1, "rgba(255,210,87,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(b.x, b.y, 26, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fffdf0";
      ctx.beginPath(); ctx.arc(b.x - 1.5, b.y - 1.5, 2.4, 0, TAU); ctx.fill();
      if (b.bounces >= 5) {
        ctx.fillStyle = "rgba(255,210,87,.7)";
        ctx.font = "bold 13px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.bounces + "/8", b.x, b.y - 18);
      }
    }
  }

  function drawEffects(L) {
    for (var i = 0; i < G.effects.length; i++) {
      var fx = G.effects[i];
      var p = Math.min(1, fx.t / fx.dur);
      var fade = 1 - p;
      if (fx.kind === "reflect") {
        ctx.strokeStyle = "rgba(94,224,255," + (fade * 0.95).toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 7 + 16 * p, 0, TAU); ctx.stroke();
        ctx.fillStyle = "rgba(170,240,255," + fade.toFixed(3) + ")";
        ctx.font = "bold 16px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        var ry = fx.y - 22 - 10 * p;
        if (ry < 22) ry = fx.y + 30 + 10 * p;
        ctx.fillText("反射", Math.max(30, Math.min(L.w - 30, fx.x)), ry);
      } else if (fx.kind === "hit") {
        // 像素爆裂：0.35 秒放大淡出
        var bimg = art("burst");
        var bp = Math.min(1, fx.t / 0.35);
        if (bimg) {
          var bs = 64 + 76 * (1 - (1 - bp) * (1 - bp));
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = Math.max(0, 1 - bp) * 0.95;
          ctx.drawImage(bimg, fx.x - bs / 2, fx.y - bs / 2, bs, bs);
          ctx.restore();
        }
        ctx.strokeStyle = "rgba(255,210,87," + (fade * 0.95).toFixed(3) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 14 + 34 * p, 0, TAU); ctx.stroke();
        ctx.strokeStyle = "rgba(255,240,190," + (fade * 0.8).toFixed(3) + ")";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 8 + 20 * p, 0, TAU); ctx.stroke();
        ctx.save();
        ctx.shadowColor = "rgba(4,8,18,.85)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "rgba(255,246,205," + fade.toFixed(3) + ")";
        ctx.font = "bold 20px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        var hy = fx.y - 36 - 18 * p;
        if (hy < 26) hy = fx.y + 42 + 18 * p;
        ctx.fillText("命中 " + fx.deg + "°", Math.max(56, Math.min(L.w - 56, fx.x)), hy);
        ctx.restore();
      } else if (fx.kind === "muzzle") {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var mg = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, 20);
        mg.addColorStop(0, "rgba(255,250,215," + (fade * 0.85).toFixed(3) + ")");
        mg.addColorStop(0.5, "rgba(255,210,87," + (fade * 0.35).toFixed(3) + ")");
        mg.addColorStop(1, "rgba(255,210,87,0)");
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 20, 0, TAU); ctx.fill();
        ctx.restore();
      } else if (fx.kind === "prism") {
        ctx.strokeStyle = "rgba(94,224,255," + (fade * 0.9).toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 10 + 30 * p, 0, TAU); ctx.stroke();
        ctx.fillStyle = "rgba(160,240,255," + fade.toFixed(3) + ")";
        ctx.font = "bold 18px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("稜鏡", fx.x, fx.y - 26 - 12 * p);
      } else if (fx.kind === "toggle") {
        ctx.strokeStyle = "rgba(94,224,255," + (fade * 0.8).toFixed(3) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, 12 + 22 * p, 0, TAU); ctx.stroke();
      }
    }
  }

  function drawBanner() {
    if (!G.banner || !G.room) return;
    var b = G.banner;
    var p = Math.min(1, b.t / b.dur);
    var a = p < 0.12 ? p / 0.12 : (p > 0.72 ? Math.max(0, (1 - p) / 0.28) : 1);
    var L = G.room.level;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = b.bad ? "rgba(52,10,24,.58)" : "rgba(8,30,42,.58)";
    rrect(L.w / 2 - 190, L.h / 2 - 36, 380, 72, 14);
    ctx.fill();
    ctx.strokeStyle = b.bad ? "rgba(255,111,145,.8)" : "rgba(94,224,255,.8)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = b.bad ? "#ffc2cf" : "#bff4ff";
    ctx.font = "bold 30px " + FONT;
    ctx.fillText(b.text, L.w / 2, L.h / 2 - (b.sub ? 8 : 0));
    if (b.sub) {
      ctx.fillStyle = "#cfe6ff";
      ctx.font = "bold 18px " + FONT;
      ctx.fillText(b.sub, L.w / 2, L.h / 2 + 22);
    }
    ctx.restore();
  }

  function drawFrame(L) {
    var p = RIC.PAD;
    var okWall = !!PAT.wall;
    if (okWall) {
      fillTile(PAT.wall, 0, 0, L.w, p, WALL_TILE);
      fillTile(PAT.wall, 0, L.h - p, L.w, p, WALL_TILE);
      fillTile(PAT.wall, 0, p, p, L.h - p * 2, WALL_TILE);
      fillTile(PAT.wall, L.w - p, p, p, L.h - p * 2, WALL_TILE);
    } else {
      ctx.fillStyle = "#1a2647";
      ctx.fillRect(0, 0, L.w, p);
      ctx.fillRect(0, L.h - p, L.w, p);
      ctx.fillRect(0, 0, p, L.h);
      ctx.fillRect(L.w - p, 0, p, L.h);
    }

    // 3px 內陰影：房間內側的角落才不會像貼紙
    ctx.save();
    ctx.beginPath();
    ctx.rect(p, p, L.w - p * 2, L.h - p * 2);
    ctx.clip();
    ctx.strokeStyle = "rgba(2,5,12,.72)";
    ctx.lineWidth = 6;
    ctx.strokeRect(p, p, L.w - p * 2, L.h - p * 2);
    ctx.restore();

    if (!okWall) {
      ctx.fillStyle = "rgba(94,224,255,.14)";
      ctx.fillRect(p, p, L.w - p * 2, 2);
      ctx.fillRect(p, L.h - p - 2, L.w - p * 2, 2);
      ctx.fillRect(p, p, 2, L.h - p * 2);
      ctx.fillRect(L.w - p - 2, p, 2, L.h - p * 2);
    } else {
      ctx.fillStyle = "rgba(94,224,255,.13)";
      ctx.fillRect(p, p, L.w - p * 2, 2);
      ctx.fillRect(p, p, 2, L.h - p * 2);
    }

    ctx.strokeStyle = "rgba(94,224,255,.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(p - 1, p - 1, L.w - p * 2 + 2, L.h - p * 2 + 2);
    ctx.strokeStyle = "rgba(255,210,87,.22)";
    ctx.lineWidth = 3;
    ctx.strokeRect(1.5, 1.5, L.w - 3, L.h - 3);
  }

  /* ---------------- 主迴圈 ---------------- */
  function loop(ts) {
    var t = ts / 1000;
    var dt = G.last ? Math.min(0.05, t - G.last) : 0.016;
    G.last = t;
    G.t += dt;
    if (G.screen === "game") {
      update(dt);
      draw();
    }
    requestAnimationFrame(loop);
  }

  /* ---------------- 離線求解（頁內版） ---------------- */
  function solveLevel(level) {
    var n = level.mirrors.length;
    var combos = Math.pow(4, n);
    var best = null;
    for (var c = 0; c < combos; c++) {
      var dirs = [];
      for (var k = 0; k < n; k++) dirs.push(Math.floor(c / Math.pow(4, k)) % 4);
      var mirrors = level.mirrors.map(function (m, i) { return { x: m.x, y: m.y, d: dirs[i] }; });
      var hits = [];
      for (k = 0; k < level.targets.length; k++) hits.push([]);
      for (var ang = -85; ang <= 85; ang++) {
        var targets = level.targets.map(function (t) { return { x: t.x, y: t.y, alive: true }; });
        var r = RIC.simShot(level, mirrors, ang, targets, RIC.SPEED);
        if (r.hit >= 0) {
          var mh = 0;
          for (var pi = 0; pi < r.path.length; pi++) if (r.path[pi].kind === "mirror") mh++;
          hits[r.hit].push({ a: ang, b: r.bounces, mh: mh });
        }
      }
      var ok = true;
      for (k = 0; k < hits.length; k++) if (!hits[k].length) ok = false;
      if (!ok) continue;
      var shots = hits.map(function (h) {
        return h.slice().sort(function (p, q) {
          return p.b - q.b || q.mh - p.mh || Math.abs(p.a) - Math.abs(q.a);
        })[0];
      });
      var total = 0, mhTotal = 0;
      for (k = 0; k < shots.length; k++) { total += shots[k].b; mhTotal += shots[k].mh; }
      if (!best || total < best.total || (total === best.total && mhTotal > best.mhTotal)) {
        best = {
          dirs: dirs,
          angles: shots.map(function (s) { return s.a; }),
          bounces: shots.map(function (s) { return s.b; }),
          mirrorHits: shots.map(function (s) { return s.mh; }),
          total: total,
          mhTotal: mhTotal,
          tolerance: hits.map(function (h) { return h.length; })
        };
      }
    }
    return best;
  }

  function reportPlan() {
    if (!G.room) return null;
    var alive = [];
    for (var i = 0; i < G.room.targets.length; i++) {
      if (G.room.targets[i].alive) alive.push({ x: G.room.targets[i].x, y: G.room.targets[i].y });
    }
    if (!alive.length) return null;
    var probe = {
      w: G.room.level.w,
      h: G.room.level.h,
      cannon: G.room.level.cannon,
      walls: G.room.level.walls,
      targets: alive,
      mirrors: G.room.mirrors.map(function (m) { return { x: m.x, y: m.y, d: m.d }; })
    };
    var best = solveLevel(probe);
    if (!best) return null;
    best.level = G.room.level.id;
    best.remaining = alive.length;
    return best;
  }

  /* ---------------- 除錯鉤子 ---------------- */
  window.__solve = function () { return reportPlan(); };
  window.__ric = {
    version: 1,
    levels: LEVELS,
    start: startRun,
    goto: function (levelIndex) {
      levelIndex = Math.max(0, Math.min(LEVELS.length - 1, levelIndex | 0));
      var rest = [];
      for (var i = 0; i < LEVELS.length; i++) if (i !== levelIndex) rest.push(i);
      shuffle(rest);
      G.run = {
        rooms: [levelIndex].concat(rest.slice(0, 5)),
        idx: 0, hearts: 3, cleared: 0, score: 0,
        upgrades: { ball: 0, slow: false, xray: false, prism: false }
      };
      G.angle = 0;
      ovEnd.hidden = true;
      ovUp.hidden = true;
      showScreen("game");
      startRoom();
    },
    plan: reportPlan,
    solveLevel: solveLevel,
    art: function () {
      var out = {};
      Object.keys(ART).forEach(function (k) { out[k] = !!(ART[k] && ART[k].ok); });
      out.wallPattern = !!PAT.wall;
      out.floorPattern = !!PAT.floor;
      return out;
    },
    snapshot: function () {
      return {
        screen: G.screen,
        mode: G.mode,
        angle: Math.round(G.angle * 10) / 10,
        room: G.room ? G.room.level.id : null,
        roomIndex: G.run ? G.run.idx : null,
        cleared: G.run ? G.run.cleared : 0,
        hearts: G.run ? G.run.hearts : 0,
        score: G.run ? G.run.cleared * 100 + G.run.hearts * 50 : 0,
        ballsLeft: G.room ? G.room.ballsLeft : 0,
        balls: G.balls.length,
        targets: G.room ? G.room.targets.map(function (t) { return !!t.alive; }) : [],
        mirrors: G.room ? G.room.mirrors.map(function (m) { return m.d; }) : [],
        upgrades: G.run ? G.run.upgrades : null,
        speed: speed(),
        fx: G.effects.map(function (e) { return e.kind; }),
        liveBalls: G.balls.map(function (b) {
          return { x: Math.round(b.x), y: Math.round(b.y), bounces: b.bounces, split: !!b.split };
        }),
        canvas: [canvas.width, canvas.height],
        css: [Math.round(cssW), Math.round(cssH)],
        scale: Math.round(scale * 1000) / 1000,
        letterbox: [Math.round(ox), Math.round(oy)]
      };
    },
    setAngle: function (deg) { G.angle = Math.max(-85, Math.min(85, deg)); },
    fire: fire,
    grant: function (k) {
      if (!G.run) return;
      if (k === "ball") G.run.upgrades.ball++;
      else if (k in G.run.upgrades) G.run.upgrades[k] = true;
      updateHud();
    },
    setMirror: function (i, d) {
      if (!G.room || !G.room.mirrors[i]) return;
      G.room.mirrors[i].d = ((d % 4) + 4) % 4;
    },
    toggleMirror: toggleMirror,
    point: function (deg, dist) {
      var L = G.room.level;
      var a = deg * Math.PI / 180;
      var c = L.cannon;
      var wx = c.x + Math.cos(a) * dist, wy = c.y - Math.sin(a) * dist;
      var r = canvas.getBoundingClientRect();
      return { x: r.left + ox + wx * scale, y: r.top + oy + wy * scale };
    },
    mirrorPoint: function (i) {
      var m = G.room.mirrors[i];
      var r = canvas.getBoundingClientRect();
      return { x: r.left + ox + m.x * scale, y: r.top + oy + m.y * scale };
    },
    fixDevicePixelRatio: function () {
      canvas.width = canvas.width;
      resize();
    }
  };

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
