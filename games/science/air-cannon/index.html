<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f8ff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c8f86'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ffb21c' stroke-width='3'/%3E%3C/svg%3E" />
  <title>空氣炮小科學家 · Air Cannon Lab</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span class="brand-copy">
          <span class="brand-kicker">AIR LAB · GRADE 2</span>
          <strong>空氣炮小科學家</strong>
        </span>
      </div>
      <div class="progress-area">
        <span id="missionCounter">任務 1 / 5</span>
        <div class="progress-track"><i id="progressFill"></i></div>
      </div>
      <div class="top-actions">
        <span class="score"><span>積分</span><b id="scoreValue">0</b><em>/500</em></span>
        <button class="round-btn" id="restartBtn" type="button" aria-label="重新開始">↺</button>
      </div>
    </header>

    <main class="stage">
      <section class="scene-wrap" id="sceneWrap" aria-label="空氣炮實驗室">
        <canvas id="scene"></canvas>
        <div class="hud-top">
          <span class="hud-chip">目標 <b id="targetValue">7 支蠟燭</b></span>
          <span class="hud-chip" id="windChip">無風</span>
          <span class="hud-chip hud-score">得分 <b id="hudScore">0</b></span>
          <span class="hud-chip" id="phaseChip">預測</span>
        </div>
        <div class="hud-bottom">
          <span id="statusText">先看小科的提示</span>
          <span id="hintText">只改變一個條件，才是公平測試</span>
        </div>
      </section>

      <aside class="side-panel" id="sidePanel">
        <div class="mascot-row">
          <div class="mascot" aria-hidden="true"><span class="antenna"></span><span class="eyes"></span></div>
          <div class="speech" id="speech">我是小科。先猜一猜，再做實驗。</div>
        </div>

        <div class="mission-head">
          <span class="step-label" id="missionLabel">任務 1 · 預測</span>
          <h1 id="missionTitle">密封大作戰</h1>
          <p id="missionSubtitle">空氣會從縫隙跑掉</p>
        </div>

        <p class="concept" id="conceptText"></p>
        <div class="fair-box" id="fairBox"></div>

        <section class="prediction-box" id="predictionBox">
          <div class="section-label"><span>先預測</span><b>+20</b></div>
          <p id="predictionQuestion"></p>
          <div class="option-list" id="predictionOptions"></div>
        </section>

        <section class="trials-box" id="trialsBox" hidden>
          <div class="section-label"><span>做實驗</span><b id="trialProgress">0 / 2</b></div>
          <div class="trial-list" id="trialList"></div>
        </section>

        <section class="data-box" id="dataBox" hidden>
          <div class="section-label"><span>實驗紀錄</span><b id="bestValue">0 支</b></div>
          <div class="data-table" id="dataTable"></div>
        </section>

        <section class="conclusion-box" id="conclusionBox" hidden>
          <div class="section-label"><span>我的結論</span><b>+40</b></div>
          <p id="conclusionQuestion"></p>
          <div class="option-list" id="conclusionOptions"></div>
          <p class="conclusion-note" id="conclusionNote"></p>
        </section>

        <section class="final-box" id="finalBox" hidden>
          <div class="section-label"><span>挑戰設定</span><b id="attemptLabel">2 次機會</b></div>
          <label class="slider-label" for="aimInput">瞄準（上 / 下）<output id="aimValue">中間</output></label>
          <input id="aimInput" type="range" min="-100" max="100" step="1" value="0" />
          <label class="slider-label" for="pullInput">力度<output id="pullValue">90%</output></label>
          <input id="pullInput" type="range" min="30" max="100" step="1" value="90" />
        </section>

        <div class="action-row">
          <button class="primary-btn" id="mainBtn" type="button" disabled>先選預測</button>
          <button class="secondary-btn" id="retryBtn" type="button" hidden>再試一次</button>
        </div>
        <p class="score-note" id="scoreNote"></p>
      </aside>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="final-overlay" id="finalOverlay" hidden>
        <section class="final-card" role="dialog" aria-modal="true" aria-labelledby="finalTitle">
          <span class="final-kicker">MISSION COMPLETE</span>
          <h2 id="finalTitle">空氣炮大師</h2>
          <p id="finalSummary"></p>
          <div class="final-score"><b id="finalScore">0</b><span>/ 500</span></div>
          <p class="final-note">預測 20 + 實驗 20 + 結論 40 + 表現 20，每關 100 分。</p>
          <button class="primary-btn" id="finalRestart" type="button">再玩一次</button>
        </section>
      </div>
    </main>
  </div>
  <script src="./src/boot.js"></script>
</body>
</html>
