<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>普通話配對</title>
<style>
  :root {
    --bg1: #fff3e4;
    --bg2: #ffe4d6;
    --card: #ffffff;
    --ink: #4a3f35;
    --accent: #ff7d4d;
    --accent-deep: #f05a2a;
    --green: #54c07a;
    --green-bg: #e7f7ec;
    --soft: #f6e7d8;
    --shadow: 0 6px 18px rgba(120, 70, 30, .14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 20px 12px 8px;
  }
  header .mascot { font-size: 2.6rem; display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  header h1 { margin: 6px 0 2px; font-size: 1.7rem; color: var(--accent-deep); letter-spacing: 1px; }
  header p { margin: 0; font-size: .9rem; color: #a3816b; }

  nav {
    display: flex; gap: 10px; justify-content: center;
    padding: 12px 10px 6px;
    position: sticky; top: 0; z-index: 6;
    background: linear-gradient(160deg, rgba(255,243,228,.96), rgba(255,228,214,.96));
    backdrop-filter: blur(4px);
  }
  nav button {
    border: 3px solid var(--accent); background: #fff; color: var(--accent-deep);
    font-size: 1.05rem; font-weight: 800; padding: 11px 24px; border-radius: 999px;
    cursor: pointer; transition: transform .12s, background .15s, color .15s;
    box-shadow: var(--shadow);
  }
  nav button:active { transform: scale(.95); }
  nav button.active { background: var(--accent); color: #fff; }

  main { max-width: 860px; margin: 0 auto; padding: 6px 14px 46px; }
  section { display: none; }
  section.on { display: block; }

  .hint {
    text-align: center; font-size: 1.02rem; font-weight: 700;
    color: #8a6f57; margin: 4px 0 12px; min-height: 1.4em;
  }
  .hint.happy { color: var(--green); }

  /* 星星進度 */
  .stars { text-align: center; font-size: 1.7rem; letter-spacing: 4px; margin: 2px 0 10px; }
  .stars span { display: inline-block; filter: grayscale(1) opacity(.35); transition: .25s; }
  .stars span.on { filter: none; transform: scale(1.08); }

  /* ---- 配對遊戲 ---- */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .col-title { text-align: center; font-weight: 800; color: #b89b84; font-size: .95rem; margin-bottom: -4px; }
  .card {
    background: var(--card); border: 4px solid transparent; border-radius: 22px;
    box-shadow: var(--shadow); min-height: 92px; padding: 12px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    transition: transform .12s, border-color .18s, background .18s, opacity .18s;
  }
  .card:active { transform: scale(.96); }
  .card .pic { font-size: 3rem; line-height: 1.05; }
  .card .pic img { width: 88px; height: 88px; object-fit: contain; }
  .card .w { font-size: 1.5rem; font-weight: 900; line-height: 1.15; }
  .card .py { font-size: .82rem; color: #b08f7a; margin-top: 3px; letter-spacing: .5px; }
  .card .tick { display: none; font-size: 1.4rem; margin-top: 2px; }
  .card.picked { border-color: var(--accent); background: #fff1e9; transform: scale(1.04); }
  .card.matched { border-color: var(--green); background: var(--green-bg); cursor: default; opacity: .92; }
  .card.matched .tick { display: block; }
  .card.wrong { border-color: #f2a0a0; background: #fff0f0; animation: shake .34s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .big-btn {
    display: block; margin: 20px auto 0; border: none;
    background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 800;
    padding: 15px 34px; border-radius: 999px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .big-btn:active { transform: scale(.95); }

  /* ---- 聽發音 ---- */
  .listen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .fcard {
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    padding: 18px 10px 14px; text-align: center; cursor: pointer;
    transition: transform .12s;
  }
  .fcard:active { transform: scale(.94); }
  .fcard .pic { font-size: 3.4rem; line-height: 1.05; }
  .fcard .pic img { width: 96px; height: 96px; object-fit: contain; }
  .fcard .w { font-size: 1.45rem; font-weight: 900; margin-top: 8px; }
  .fcard .py { font-size: .84rem; color: #b08f7a; margin-top: 2px; }
  .fcard .spk {
    margin-top: 10px; display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 1.5rem;
    box-shadow: var(--shadow);
  }
  .fcard.playing { outline: 5px solid var(--accent); outline-offset: 3px; }

  /* 彩帶 */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .confetti-bit { position: absolute; top: -12%; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(118vh) rotate(560deg); opacity: 0; } }
</style>
</head>
<body>
  <header>
    <span class="mascot">🐼</span>
    <h1>普通話配對</h1>
    <p>聽一聽 · 配一配 · 學普通話</p>
  </header>

  <nav>
    <button id="tab-match" class="active">🎮 配對遊戲</button>
    <button id="tab-listen">🔊 聽發音</button>
  </nav>

  <main>
    <section id="sec-match" class="on">
      <div class="stars" id="stars"></div>
      <div class="hint" id="match-hint">👆 先點詞語，再點圖片</div>
      <div class="board" id="board"></div>
      <button class="big-btn" id="btn-replay">🔄 再玩一次</button>
    </section>

    <section id="sec-listen">
      <div class="hint">👆 點卡片，聽普通話</div>
      <div class="listen-grid" id="listen-grid"></div>
      <button class="big-btn" id="btn-listen-all">▶️ 連續播放全部</button>
    </section>
  </main>

  <div id="confetti"></div>

<script>
/* ============================================================
   詞語表（示範資料）
   - word  ：詞語（普通話用字）
   - pinyin：拼音
   - pic   ：emoji 佔位圖；換真圖時把 img 填成圖片路徑（如 images/apple.png）
   - audio ：發音檔，放 audio/ 資料夾
   要加詞語：照格式加一筆，再用 make_audio.py 生成對應 MP3。
   ============================================================ */
const ITEMS = [
  { id: 0, word: "蘋果",  pinyin: "píng guǒ",   pic: "🍎", img: "", audio: "audio/pingguo.mp3" },
  { id: 1, word: "香蕉",  pinyin: "xiāng jiāo", pic: "🍌", img: "", audio: "audio/xiangjiao.mp3" },
  { id: 2, word: "小貓",  pinyin: "xiǎo māo",   pic: "🐱", img: "", audio: "audio/xiaomao.mp3" },
  { id: 3, word: "小狗",  pinyin: "xiǎo gǒu",   pic: "🐶", img: "", audio: "audio/xiaogou.mp3" },
  { id: 4, word: "眼睛",  pinyin: "yǎn jīng",   pic: "👀", img: "", audio: "audio/yanjing.mp3" },
  { id: 5, word: "鼻子",  pinyin: "bí zi",      pic: "👃", img: "", audio: "audio/bizi.mp3" },
];

const PAIRS = 4; // 每輪配對數量（低年級 4 對最合適）

/* ---- 工具 ---- */
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function picHTML(it, size) {
  return it.img
    ? `<img src="${it.img}" alt="${it.word}" style="width:${size}px;height:${size}px;object-fit:contain;">`
    : it.pic;
}

/* ---- 音效 ---- */
let audioEl = new Audio();
function play(path) {
  if (!path) return;
  try {
    audioEl.src = path;
    audioEl.currentTime = 0;
    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
let actx = null;
function chime(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    const f = ok ? [523.25, 659.25, 783.99, 1046.5] : [196, 165];
    f.forEach((freq, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      const s = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.2, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.34);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s + 0.4);
    });
  } catch (e) {}
}
function celebrate() {
  const emo = ["🎉", "⭐", "🎊", "🌟", "👏", "💛", "🧡"];
  const box = document.getElementById("confetti");
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.className = "confetti-bit";
    s.textContent = emo[Math.floor(Math.random() * emo.length)];
    s.style.left = (Math.random() * 100) + "%";
    s.style.fontSize = (20 + Math.random() * 28) + "px";
    s.style.animationDuration = (1.7 + Math.random() * 1.5) + "s";
    s.style.animationDelay = (Math.random() * 0.5) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3800);
  }
}

/* ---- 配對遊戲 ---- */
const board = document.getElementById("board");
const hintEl = document.getElementById("match-hint");
const starsEl = document.getElementById("stars");
let roundItems = [];
let pickedWord = null;
let matched = 0;
let wrongs = 0;
let done = false;

function renderStars() {
  starsEl.innerHTML = "";
  for (let i = 0; i < PAIRS; i++) {
    const s = document.createElement("span");
    s.textContent = "⭐";
    if (i < matched) s.className = "on";
    starsEl.appendChild(s);
  }
}
function buildMatch() {
  done = false; matched = 0; wrongs = 0; pickedWord = null;
  hintEl.textContent = "👆 先點詞語，再點圖片";
  hintEl.classList.remove("happy");
  board.innerHTML = "";
  renderStars();

  roundItems = shuffle(ITEMS).slice(0, PAIRS);
  const left = document.createElement("div");
  left.className = "col";
  left.innerHTML = '<div class="col-title">詞語</div>';
  const right = document.createElement("div");
  right.className = "col";
  right.innerHTML = '<div class="col-title">圖片</div>';

  shuffle(roundItems).forEach(it => {
    const c = document.createElement("div");
    c.className = "card";
    c.dataset.id = it.id;
    c.innerHTML = `<div class="w">${it.word}</div><div class="py">${it.pinyin}</div>`;
    c.addEventListener("click", () => pickWord(c, it));
    left.appendChild(c);
  });
  shuffle(roundItems).forEach(it => {
    const c = document.createElement("div");
    c.className = "card";
    c.dataset.id = it.id;
    c.innerHTML = `<div class="pic">${picHTML(it, 88)}</div>`;
    c.addEventListener("click", () => pickPic(c, it));
    right.appendChild(c);
  });

  board.appendChild(left);
  board.appendChild(right);
}

function pickWord(card, item) {
  if (done || card.classList.contains("matched")) return;
  document.querySelectorAll(".card.picked").forEach(c => c.classList.remove("picked"));
  card.classList.add("picked");
  pickedWord = card;
  play(item.audio);
  hintEl.textContent = "🔊 " + item.word;
}

function pickPic(card, item) {
  if (done || card.classList.contains("matched")) return;
  if (!pickedWord) { // 還沒選詞語，點圖片就只唸發音
    play(item.audio);
    hintEl.textContent = "👆 先點左邊的詞語哦";
    return;
  }
  const wItem = roundItems.find(x => String(x.id) === pickedWord.dataset.id);
  if (pickedWord.dataset.id === String(item.id)) {
    // 配對成功
    pickedWord.classList.remove("picked");
    pickedWord.classList.add("matched");
    pickedWord.innerHTML += '<div class="tick">✅</div>';
    card.classList.add("matched");
    card.innerHTML += '<div class="tick">✅</div>';
    matched++;
    renderStars();
    chime(true);
    play(item.audio);
    pickedWord = null;
    if (matched === PAIRS) {
      done = true;
      const score = Math.max(0, PAIRS - wrongs);
      hintEl.textContent = "🎉 好叻呀！全部配對成功！";
      hintEl.classList.add("happy");
      celebrate();
      setTimeout(() => chime(true), 350);
      reportScore(score);
    } else {
      hintEl.textContent = "✅ 做對了！繼續～";
    }
  } else {
    // 配錯：搖一搖，重播詞語音，鼓勵再試
    wrongs++;
    card.classList.add("wrong");
    setTimeout(() => card.classList.remove("wrong"), 360);
    hintEl.textContent = "👂 聽一聽，再試一次";
    if (wItem) play(wItem.audio);
  }
}

function reportScore(score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "game-score", score: score }, location.origin);
    }
  } catch (e) {}
}
document.getElementById("btn-replay").addEventListener("click", buildMatch);

/* ---- 聽發音 ---- */
const listenGrid = document.getElementById("listen-grid");
function buildListen() {
  listenGrid.innerHTML = "";
  ITEMS.forEach(it => {
    const c = document.createElement("div");
    c.className = "fcard";
    c.innerHTML = `
      <div class="pic">${picHTML(it, 96)}</div>
      <div class="w">${it.word}</div>
      <div class="py">${it.pinyin}</div>
      <div class="spk">🔊</div>`;
    c.addEventListener("click", () => {
      c.classList.add("playing");
      play(it.audio);
      setTimeout(() => c.classList.remove("playing"), 700);
    });
    listenGrid.appendChild(c);
  });
}
document.getElementById("btn-listen-all").addEventListener("click", () => {
  ITEMS.forEach((it, i) => setTimeout(() => play(it.audio), i * 1300));
});

/* ---- 分頁 ---- */
const tabMatch = document.getElementById("tab-match");
const tabListen = document.getElementById("tab-listen");
const secMatch = document.getElementById("sec-match");
const secListen = document.getElementById("sec-listen");
function switchTab(which) {
  const isMatch = which === "match";
  tabMatch.classList.toggle("active", isMatch);
  tabListen.classList.toggle("active", !isMatch);
  secMatch.classList.toggle("on", isMatch);
  secListen.classList.toggle("on", !isMatch);
  if (isMatch) buildMatch(); else buildListen();
}
tabMatch.addEventListener("click", () => switchTab("match"));
tabListen.addEventListener("click", () => switchTab("listen"));

buildMatch();
</script>
</body>
</html>
