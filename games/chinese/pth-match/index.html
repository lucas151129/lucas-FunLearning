<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7f0">
<title>普通話配對</title>
<style>
  :root {
    --bg-top: #fff7f0;
    --bg-bottom: #ffecef;
    --card: #ffffff;
    --text: #5c4a44;
    --text-soft: #b39a8e;
    --coral: #ff8a7a;
    --coral-deep: #f46b6b;
    --mint: #5bc68f;
    --mint-bg: #e9f9f0;
    --shadow: 0 8px 22px rgba(214, 156, 120, .16);
    --radius: 26px;
  }
  /* ---- 兩種裝置的尺寸 ---- */
  body {
    --cols: 2;                 /* 配對區一行的格數 */
    --gap: 8px;
    --pic: clamp(84px, 27vw, 112px);
    --fmin: 148px;             /* 聽發音卡最小寬 */
    --mascot: 64px;
    --title: 1.2rem;
    --word: clamp(1.05rem, 4.6vw, 1.3rem);
    --pinyin: .7rem;
    --navfont: .92rem;
    --navpad: 8px 16px;
    --pad: 14px;
    --speaker: 40px;
  }
  body.dev-ipad {
    --cols: 4;
    --gap: 18px;
    --pic: clamp(120px, 17vw, 175px);
    --fmin: 190px;
    --mascot: 112px;
    --title: 2.2rem;
    --word: clamp(1.5rem, 2.6vw, 2rem);
    --pinyin: .95rem;
    --navfont: 1.15rem;
    --navpad: 13px 30px;
    --pad: 24px;
    --speaker: 54px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "PingFang SC", "Noto Sans TC", "Microsoft JhengHei",
                 -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  body.choosing { overflow: hidden; }

  /* 柔軟背景裝飾 */
  .bg-blob {
    position: fixed; border-radius: 50%; filter: blur(46px);
    opacity: .5; pointer-events: none; z-index: 0;
  }
  .bg-blob.b1 { width: 260px; height: 260px; left: -90px; top: -70px; background: #ffe0c9; }
  .bg-blob.b2 { width: 300px; height: 300px; right: -110px; top: 30%; background: #ffe1ea; }
  .bg-blob.b3 { width: 240px; height: 240px; left: -80px; bottom: -60px; background: #e2f6ec; }

  header {
    position: relative; z-index: 1; text-align: center;
    padding: calc(18px + env(safe-area-inset-top)) 14px 6px;
  }
  .mascot { display: inline-block; animation: bob 3s ease-in-out infinite; }
  .mascot img {
    width: var(--mascot); height: var(--mascot); border-radius: 50%; object-fit: cover;
    box-shadow: 0 6px 18px rgba(244, 107, 107, .28);
    border: 3px solid #fff;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  header h1 {
    margin: 8px 0 2px; font-size: var(--title);
    color: var(--coral-deep); letter-spacing: 1px; font-weight: 900;
  }
  header p { margin: 0; font-size: .92rem; color: var(--text-soft); }

  nav {
    position: sticky; top: 0; z-index: 6; display: flex; gap: 10px; justify-content: center;
    padding: 14px 12px 6px;
    background: linear-gradient(165deg, rgba(255,247,240,.95), rgba(255,236,239,.95));
    backdrop-filter: blur(6px);
  }
  nav button {
    border: 3px solid var(--coral); background: #fff; color: var(--coral-deep);
    font-size: var(--navfont); font-weight: 800; padding: var(--navpad); border-radius: 999px;
    cursor: pointer; transition: transform .13s, background .16s, color .16s, box-shadow .16s;
    box-shadow: 0 6px 16px rgba(244, 107, 107, .18);
  }
  nav button:active { transform: scale(.94); }
  nav button.active { background: var(--coral); color: #fff; box-shadow: 0 8px 18px rgba(244, 107, 107, .34); }

  main {
    position: relative; z-index: 1; max-width: 980px; margin: 0 auto;
    padding: 8px max(var(--pad), env(safe-area-inset-right)) 40px max(var(--pad), env(safe-area-inset-left));
  }
  section { display: none; }
  section.on { display: block; }

  .hint {
    text-align: center; font-size: 1.02rem; font-weight: 700;
    color: #a5877b; margin: 6px 0 12px; min-height: 1.5em;
  }
  .hint.happy { color: var(--mint); }

  /* 星星進度 */
  .stars { text-align: center; font-size: clamp(1.6rem, 6vw, 2.2rem); letter-spacing: 6px; margin: 4px 0 8px; }
  .stars span { display: inline-block; filter: grayscale(1) opacity(.3); transition: .3s; }
  .stars span.on { filter: none; animation: star-pop .4s ease; }
  @keyframes star-pop { 0% { transform: scale(.3) rotate(-20deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* ---- 配對：圖片在上、詞語在下 ---- */
  .row-title {
    text-align: center; font-weight: 800; color: #c4a99b;
    font-size: .9rem; margin: 10px 0 6px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: var(--gap);
  }
  .card {
    background: var(--card); border: 4px solid transparent; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: transform .13s, border-color .18s, background .18s;
  }
  .card:active { transform: scale(.95); }
  .card.wordcard { min-height: 86px; }
  .card .w { font-size: var(--word); font-weight: 900; line-height: 1.15; letter-spacing: 1px; }
  .card .py { font-size: var(--pinyin); color: var(--text-soft); margin-top: 4px; letter-spacing: .5px; }

  /* 圖片（生圖）與 emoji 後備 */
  .pic {
    width: var(--pic); height: var(--pic);
    border-radius: 20px; object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.08));
  }
  .pic.pic-emoji {
    object-fit: unset; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--pic) * .55); line-height: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff, var(--tint, #ffe7d4));
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.05), 0 4px 10px rgba(0,0,0,.06);
    filter: none;
  }
  .card .tick {
    display: none; font-size: 1.15rem; margin-top: 2px;
    color: var(--mint); font-weight: 900;
  }
  .card.picked { border-color: var(--coral); background: #fff2ee; transform: scale(1.04); }
  .card.matched { border-color: var(--mint); background: var(--mint-bg); cursor: default; }
  .card.matched .tick { display: block; }
  .card.matched .pic, .card.matched .w { opacity: .82; }
  .card.wrong { border-color: #f2b1b1; background: #fff1f1; animation: wiggle .38s; }
  @keyframes wiggle {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .big-btn {
    display: block; margin: 20px auto 0; border: none;
    background: linear-gradient(180deg, var(--coral), var(--coral-deep)); color: #fff;
    font-size: 1.08rem; font-weight: 800; padding: 15px 36px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 10px 22px rgba(244, 107, 107, .3);
    transition: transform .13s;
  }
  .big-btn:active { transform: scale(.94); }
  .big-btn.green { background: linear-gradient(180deg, #6fd3a0, var(--mint)); box-shadow: 0 10px 22px rgba(91, 198, 143, .3); }

  /* 手機：把頭部壓薄，令圖片＋詞語一屏放得落 */
  body.dev-phone header { padding: calc(10px + env(safe-area-inset-top)) 12px 2px; }
  body.dev-phone header p { display: none; }
  body.dev-phone header h1 { margin: 4px 0 0; }
  body.dev-phone nav { padding: 8px 8px 2px; gap: 8px; }
  body.dev-phone .stars { font-size: 1.25rem; margin: 0 0 2px; }
  body.dev-phone .hint { font-size: .9rem; margin: 2px 0 4px; }
  body.dev-phone .row-title { margin: 6px 0 4px; font-size: .8rem; }
  body.dev-phone .card.wordcard { min-height: 64px; }
  body.dev-phone .card { padding: 8px 6px; }
  body.dev-phone .big-btn { margin-top: 14px; padding: 12px 30px; font-size: 1rem; }

  /* 平板：鬆一點 */
  body.dev-ipad .card.wordcard { min-height: 110px; }
  body.dev-ipad .hint { font-size: 1.12rem; margin: 10px 0 14px; }
  body.dev-ipad .row-title { font-size: 1rem; margin: 14px 0 10px; }

  .ghost {
    display: block; margin: 26px auto 0; background: transparent; border: none;
    color: #c4a99b; font-size: .9rem; text-decoration: underline; cursor: pointer;
    font-family: inherit;
  }

  /* ---- 聽發音 ---- */
  .listen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--fmin), 1fr)); gap: var(--gap); }
  .fcard {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 10px 12px; text-align: center; cursor: pointer;
    transition: transform .13s; user-select: none; -webkit-user-select: none;
  }
  .fcard:active { transform: scale(.94); }
  .fcard .pic { margin: 0 auto; }
  .fcard .w { font-size: calc(var(--word) * .95); font-weight: 900; margin-top: 8px; }
  .fcard .py { font-size: var(--pinyin); color: var(--text-soft); margin-top: 2px; }
  .fcard .spk {
    margin: 10px auto 0; display: flex; align-items: center; justify-content: center;
    width: var(--speaker); height: var(--speaker); border-radius: 50%;
    background: linear-gradient(180deg, var(--coral), var(--coral-deep)); color: #fff;
    font-size: calc(var(--speaker) * .45); box-shadow: 0 6px 14px rgba(244, 107, 107, .3);
  }
  .fcard.playing { outline: 5px solid var(--coral); outline-offset: 4px; border-radius: var(--radius); }

  /* 彩帶 */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .confetti-bit { position: absolute; top: -12%; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(118vh) rotate(560deg); opacity: 0; } }

  /* ---- 進場選裝置 ---- */
  .chooser {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 26px;
    background: linear-gradient(165deg, #fff7f0, #ffecef);
  }
  .chooser.hide { display: none; }
  .chooser img {
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
    border: 4px solid #fff; box-shadow: 0 8px 22px rgba(244, 107, 107, .26);
  }
  .chooser h2 {
    margin: 6px 0 0; font-size: 1.35rem; color: var(--coral-deep); font-weight: 900;
  }
  .chooser p { margin: 0 0 6px; color: var(--text-soft); font-size: .92rem; }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .opts button {
    width: 148px; padding: 20px 10px 18px; border-radius: 28px; cursor: pointer;
    border: 4px solid #ffd9d1; background: #fff; font-family: inherit;
    box-shadow: 0 10px 24px rgba(214, 156, 120, .18);
    transition: transform .13s, border-color .16s, background .16s;
  }
  .opts button:active { transform: scale(.96); }
  .opts button.sel { border-color: var(--coral); background: #fff2ee; }
  .opts .ico { display: block; font-size: 3rem; line-height: 1; margin-bottom: 10px; }
  .opts .lbl { display: block; font-size: 1.1rem; font-weight: 900; color: var(--text); }
  .opts .sub { display: block; font-size: .78rem; color: var(--text-soft); margin-top: 4px; }
</style>
</head>
<body class="choosing">

  <div id="chooser" class="chooser">
    <img src="images/kongkong-3c.png" alt="空空（狗博士）">
    <h2>你是用哪一種？</h2>
    <p>選好就開始玩</p>
    <div class="opts">
      <button data-dev="phone"><span class="ico">📱</span><span class="lbl">手機</span><span class="sub">直向、兩格一列</span></button>
      <button data-dev="ipad"><span class="ico">📲</span><span class="lbl">平板 / iPad</span><span class="sub">四格一列、大字</span></button>
    </div>
  </div>

  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <header>
    <span class="mascot"><img src="images/kongkong-3c.png" alt="空空（狗博士）"></span>
    <h1>普通話配對</h1>
    <p>聽一聽 · 配一配 · 學普通話</p>
  </header>

  <nav>
    <button id="tab-listen" class="active">🔊 聽發音</button>
    <button id="tab-match">🎮 配對遊戲</button>
  </nav>

  <main>
    <section id="sec-listen" class="on">
      <div class="hint">👆 點卡片，聽普通話</div>
      <div class="listen-grid" id="listen-grid"></div>
      <button class="big-btn green" id="btn-listen-all">▶️ 連續播放全部</button>
    </section>

    <section id="sec-match">
      <div class="stars" id="stars"></div>
      <div class="hint" id="match-hint">👆 先點下面的詞語，再點上面的圖片</div>
      <div class="row-title">圖片</div>
      <div class="grid" id="pic-grid"></div>
      <div class="row-title">詞語</div>
      <div class="grid" id="word-grid"></div>
      <button class="big-btn" id="btn-replay">🔄 換一組</button>
    </section>

    <button class="ghost" id="btn-device">📱 切換裝置</button>
  </main>

  <div id="confetti"></div>

<script>
/* ============================================================
   詞語表（K1 詞語二，30 個）
   - word  ：詞語（繁體）
   - pinyin：拼音（放在詞語下面的小字）
   - img   ：詞語插圖（生圖，放 images/ 資料夾）
   - pic   ：emoji 後備（圖片載入失敗時自動換上）
   - audio ：發音檔（檔名同圖檔）
   要加詞語：照格式加一筆，跑 make_images.py 與 make_audio.py。
   ============================================================ */
const ITEMS = [
  { id:  0, word: "早上好", pinyin: "zǎo shang hǎo", img: "images/zaoshanghao.png", pic: "🌅" },
  { id:  1, word: "同學",   pinyin: "tóng xué",      img: "images/tongxue.png",     pic: "👫" },
  { id:  2, word: "老師",   pinyin: "lǎo shī",       img: "images/laoshi.png",      pic: "👩‍🏫" },
  { id:  3, word: "遊戲",   pinyin: "yóu xì",        img: "images/youxi.png",       pic: "🧩" },
  { id:  4, word: "唱歌",   pinyin: "chàng gē",      img: "images/changge.png",     pic: "🎤" },
  { id:  5, word: "學習",   pinyin: "xué xí",        img: "images/xuexi.png",       pic: "📚" },
  { id:  6, word: "眼睛",   pinyin: "yǎn jing",      img: "images/yanjing.png",     pic: "👀" },
  { id:  7, word: "耳朵",   pinyin: "ěr duo",        img: "images/erduo.png",       pic: "👂" },
  { id:  8, word: "嘴巴",   pinyin: "zuǐ ba",        img: "images/zuiba.png",       pic: "👄" },
  { id:  9, word: "刷牙",   pinyin: "shuā yá",       img: "images/shuaya.png",      pic: "🪥" },
  { id: 10, word: "洗臉",   pinyin: "xǐ liǎn",       img: "images/xilian.png",      pic: "🚿" },
  { id: 11, word: "洗手",   pinyin: "xǐ shǒu",       img: "images/xishou.png",      pic: "🧼" },
  { id: 12, word: "爸爸",   pinyin: "bà ba",         img: "images/baba.png",        pic: "👨" },
  { id: 13, word: "媽媽",   pinyin: "mā ma",         img: "images/mama.png",        pic: "👩" },
  { id: 14, word: "哥哥",   pinyin: "gē ge",         img: "images/gege.png",        pic: "🧑" },
  { id: 15, word: "弟弟",   pinyin: "dì di",         img: "images/didi.png",        pic: "👦" },
  { id: 16, word: "姐姐",   pinyin: "jiě jie",       img: "images/jiejie.png",      pic: "👱‍♀️" },
  { id: 17, word: "妹妹",   pinyin: "mèi mei",       img: "images/meimei.png",      pic: "👧" },
  { id: 18, word: "麵包",   pinyin: "miàn bāo",      img: "images/mianbao.png",     pic: "🍞" },
  { id: 19, word: "蛋糕",   pinyin: "dàn gāo",       img: "images/dangao.png",      pic: "🍰" },
  { id: 20, word: "餅乾",   pinyin: "bǐng gān",      img: "images/binggan.png",     pic: "🍪" },
  { id: 21, word: "麵條",   pinyin: "miàn tiáo",     img: "images/miantiao.png",    pic: "🍜" },
  { id: 22, word: "牛奶",   pinyin: "niú nǎi",       img: "images/niunai.png",      pic: "🥛" },
  { id: 23, word: "果汁",   pinyin: "guǒ zhī",       img: "images/guozhi.png",      pic: "🧃" },
  { id: 24, word: "水果",   pinyin: "shuǐ guǒ",      img: "images/shuiguo.png",     pic: "🧺" },
  { id: 25, word: "蘋果",   pinyin: "píng guǒ",      img: "images/pingguo.png",     pic: "🍎" },
  { id: 26, word: "香蕉",   pinyin: "xiāng jiāo",    img: "images/xiangjiao.png",   pic: "🍌" },
  { id: 27, word: "西瓜",   pinyin: "xī guā",        img: "images/xigua.png",       pic: "🍉" },
  { id: 28, word: "葡萄",   pinyin: "pú táo",        img: "images/putao.png",       pic: "🍇" },
  { id: 29, word: "樹葉",   pinyin: "shù yè",        img: "images/shuye.png",       pic: "🍃" },
];
// 發音檔名 = 圖檔名，換 .png 為 .mp3
ITEMS.forEach(it => { it.audio = "audio/" + it.img.slice(7).replace(/\.png$/, ".mp3"); });

const PAIRS = 4; // 每局配對數量（低年級 4 對最合適）

/* ---- 工具 ---- */
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function picHTML(it) {
  return `<img class="pic" src="${it.img}" alt="${it.word}" loading="lazy" decoding="async"
            onerror="picFallback(this,'${it.pic}')">`;
}
function picFallback(img, emoji) {
  const d = document.createElement("div");
  d.className = "pic pic-emoji";
  d.textContent = emoji;
  img.replaceWith(d);
}

/* 一疊 30 個詞，每次抽 4 個；抽完再洗，保證玩得齊全部詞語 */
let deck = [];
function drawItems(n) {
  const out = [];
  while (out.length < n && out.length < ITEMS.length) {
    if (!deck.length) deck = shuffle(ITEMS);
    const it = deck.pop();
    if (!out.some(x => x.id === it.id)) out.push(it);
  }
  return out;
}

/* ---- 音效 ---- */
let audioEl = new Audio();
function play(path) {
  if (!path) return;
  try {
    audioEl.src = path;
    audioEl.currentTime = 0;
    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
let actx = null;
function chime(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    const f = ok ? [523.25, 659.25, 783.99, 1046.5] : [196, 165];
    f.forEach((freq, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      const s = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.2, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.34);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s + 0.4);
    });
  } catch (e) {}
}
function celebrate() {
  const emo = ["🎉", "⭐", "🎊", "🌟", "👏", "💛", "🧡"];
  const box = document.getElementById("confetti");
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("span");
    s.className = "confetti-bit";
    s.textContent = emo[Math.floor(Math.random() * emo.length)];
    s.style.left = (Math.random() * 100) + "%";
    s.style.fontSize = (20 + Math.random() * 30) + "px";
    s.style.animationDuration = (1.7 + Math.random() * 1.5) + "s";
    s.style.animationDelay = (Math.random() * 0.5) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

/* ---- 裝置（手機／平板） ---- */
const DEV_KEY = "pth-device";
let device = "phone";
const chooserEl = document.getElementById("chooser");

function applyDevice(d, remember) {
  device = d === "ipad" ? "ipad" : "phone";
  document.body.classList.remove("dev-phone", "dev-ipad", "choosing");
  document.body.classList.add(device === "ipad" ? "dev-ipad" : "dev-phone");
  chooserEl.classList.add("hide");
  document.querySelectorAll(".opts button").forEach(b => {
    b.classList.toggle("sel", b.dataset.dev === device);
  });
  if (remember) {
    try { localStorage.setItem(DEV_KEY, device); } catch (e) {}
  }
  buildMatch();
  buildListen();
}

document.querySelectorAll(".opts button").forEach(b => {
  b.addEventListener("click", () => applyDevice(b.dataset.dev, true));
});
document.getElementById("btn-device").addEventListener("click", () => {
  document.body.classList.add("choosing");
  chooserEl.classList.remove("hide");
});

// 記住上次用哪種，進場時先預選（但仍然讓他自己按一下）
(function () {
  let last = null;
  try { last = localStorage.getItem(DEV_KEY); } catch (e) {}
  if (last) {
    document.querySelectorAll(".opts button").forEach(b => {
      b.classList.toggle("sel", b.dataset.dev === last);
    });
  }
})();

/* ---- 配對遊戲 ---- */
const picGrid = document.getElementById("pic-grid");
const wordGrid = document.getElementById("word-grid");
const hintEl = document.getElementById("match-hint");
const starsEl = document.getElementById("stars");
let roundItems = [];
let pickedWord = null;
let matched = 0;
let wrongs = 0;
let done = false;

function renderStars() {
  starsEl.innerHTML = "";
  for (let i = 0; i < PAIRS; i++) {
    const s = document.createElement("span");
    s.textContent = "⭐";
    if (i < matched) s.className = "on";
    starsEl.appendChild(s);
  }
}
function buildMatch() {
  done = false; matched = 0; wrongs = 0; pickedWord = null;
  hintEl.textContent = "👆 先點下面的詞語，再點上面的圖片";
  hintEl.classList.remove("happy");
  picGrid.innerHTML = "";
  wordGrid.innerHTML = "";
  renderStars();

  roundItems = drawItems(PAIRS);

  // 上：圖片
  shuffle(roundItems).forEach(it => {
    const c = document.createElement("div");
    c.className = "card piccard";
    c.dataset.id = it.id;
    c.innerHTML = picHTML(it);
    c.addEventListener("click", () => pickPic(c, it));
    picGrid.appendChild(c);
  });
  // 下：詞語（繁體 + 小字拼音）
  shuffle(roundItems).forEach(it => {
    const c = document.createElement("div");
    c.className = "card wordcard";
    c.dataset.id = it.id;
    c.innerHTML = `<div class="w">${it.word}</div><div class="py">${it.pinyin}</div>`;
    c.addEventListener("click", () => pickWord(c, it));
    wordGrid.appendChild(c);
  });
}

function pickWord(card, item) {
  if (done || card.classList.contains("matched")) return;
  document.querySelectorAll(".card.picked").forEach(c => c.classList.remove("picked"));
  card.classList.add("picked");
  pickedWord = card;
  play(item.audio);
  hintEl.textContent = "🔊 " + item.word;
}

function pickPic(card, item) {
  if (done || card.classList.contains("matched")) return;
  if (!pickedWord) {
    play(item.audio);
    hintEl.textContent = "👆 先點下面的詞語哦";
    return;
  }
  const wItem = roundItems.find(x => String(x.id) === pickedWord.dataset.id);
  if (pickedWord.dataset.id === String(item.id)) {
    pickedWord.classList.remove("picked");
    pickedWord.classList.add("matched");
    pickedWord.innerHTML += '<div class="tick">✅</div>';
    card.classList.add("matched");
    card.innerHTML += '<div class="tick">✅</div>';
    matched++;
    renderStars();
    chime(true);
    play(item.audio);
    pickedWord = null;
    if (matched === PAIRS) {
      done = true;
      const score = Math.max(0, PAIRS - wrongs);
      hintEl.textContent = "🎉 好叻呀！全部配對成功！";
      hintEl.classList.add("happy");
      celebrate();
      setTimeout(() => chime(true), 350);
      reportScore(score);
    } else {
      hintEl.textContent = "✅ 做對了！繼續～";
    }
  } else {
    wrongs++;
    card.classList.add("wrong");
    setTimeout(() => card.classList.remove("wrong"), 400);
    hintEl.textContent = "👂 聽一聽，再試一次";
    if (wItem) play(wItem.audio);
  }
}

function reportScore(score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "game-score", score: score }, location.origin);
    }
  } catch (e) {}
}
document.getElementById("btn-replay").addEventListener("click", buildMatch);

/* ---- 聽發音 ---- */
const listenGrid = document.getElementById("listen-grid");
function buildListen() {
  listenGrid.innerHTML = "";
  ITEMS.forEach(it => {
    const c = document.createElement("div");
    c.className = "fcard";
    c.innerHTML = `
      ${picHTML(it)}
      <div class="w">${it.word}</div>
      <div class="py">${it.pinyin}</div>
      <div class="spk">🔊</div>`;
    c.addEventListener("click", () => {
      c.classList.add("playing");
      play(it.audio);
      setTimeout(() => c.classList.remove("playing"), 700);
    });
    listenGrid.appendChild(c);
  });
}
// 每個音檔約 1.9 秒（edge-tts 有固定的前後靜音），間隔取 2.1 秒才不會疊聲
document.getElementById("btn-listen-all").addEventListener("click", () => {
  ITEMS.forEach((it, i) => setTimeout(() => play(it.audio), i * 2100));
});

/* ---- 分頁（聽發音在前） ---- */
const tabListen = document.getElementById("tab-listen");
const tabMatch = document.getElementById("tab-match");
const secListen = document.getElementById("sec-listen");
const secMatch = document.getElementById("sec-match");
function switchTab(which) {
  const isListen = which === "listen";
  tabListen.classList.toggle("active", isListen);
  tabMatch.classList.toggle("active", !isListen);
  secListen.classList.toggle("on", isListen);
  secMatch.classList.toggle("on", !isListen);
  if (!isListen) buildMatch();
}
tabListen.addEventListener("click", () => switchTab("listen"));
tabMatch.addEventListener("click", () => switchTab("match"));

/* 未選裝置前先鋪一版（手機尺寸），選完會重建 */
document.body.classList.add("dev-phone");
buildListen();
buildMatch();

/* 直接用網址參數指定（例如嵌在 iframe）：?dev=phone|ipad&tab=listen|match */
(function () {
  const q = new URLSearchParams(location.search);
  const d = q.get("dev");
  if (d === "phone" || d === "ipad") applyDevice(d, false);
  if (q.get("tab") === "match") switchTab("match");
})();
</script>
